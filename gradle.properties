# Gradle build performance
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Kotlin code style
kotlin.code.style=official

# Suppress the warning for Kotlin/Native targets that are disabled on the
# current host architecture (e.g. iosX64 on ARM64 macOS runners).
kotlin.native.ignoreDisabledTargets=true

# AGP 8.11+ defaults to built-in Kotlin integration, which conflicts with
# modules that still apply the org.jetbrains.kotlin.android plugin.
android.builtInKotlin=false
