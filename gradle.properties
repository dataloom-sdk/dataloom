# Gradle build performance
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

# KSP and Kotlin compilation run in the Kotlin daemon. Keep its memory bounded
# independently so Android validation cannot inherit undersized JVM defaults.
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m

# Kotlin code style
kotlin.code.style=official

# Suppress the warning for Kotlin/Native targets that are disabled on the
# current host architecture (e.g. iosX64 on ARM64 macOS runners).
kotlin.native.ignoreDisabledTargets=true

# Supply-chain evidence (#93): gradle/verification-metadata.xml pins a
# SHA-256 checksum for every dependency artifact resolved so far. Lenient
# mode logs a warning and continues instead of failing the build on a
# checksum mismatch or an artifact missing from the file, because the
# metadata was generated from one Windows host and has not yet been
# reconciled against the macOS (Apple validation) and Linux (Android/
# build-and-tests validation) CI runners, which can resolve additional
# platform-specific artifacts this host never touches. See
# docs/security/supply-chain-evidence.md before switching to strict mode.
org.gradle.dependency.verification=lenient
