name: One-time inline-refresh plan correspondence fix

on:
  push:
    branches:
      - agent/dl-strategy-016-inline-cache-refresh-runtime

permissions:
  contents: write

concurrency:
  group: inline-refresh-plan-correspondence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    name: Declare checkpoint read in inline refresh plan
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply audited plan-correspondence correction
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def regex_replace(
              path: str,
              pattern: str,
              replacement: str,
              expected: int = 1,
          ) -> None:
              file = Path(path)
              text = file.read_text()
              updated, count = re.subn(pattern, replacement, text)
              if count != expected:
                  raise SystemExit(
                      f"{path}: expected {expected} audited replacement(s), found {count}"
                  )
              file.write_text(updated)

          evaluator = (
              "dataloom-runtime/src/commonMain/kotlin/io/dataloom/runtime/strategy/"
              "BuiltInSynchronizationStrategyEvaluator.kt"
          )
          regex_replace(
              evaluator,
              r"        \} else \{\n            listOf\(StrategyOperation\.PULL_REMOTE, StrategyOperation\.PERSIST_REMOTE\)\n        \}",
              "        } else {\n"
              "            listOf(\n"
              "                StrategyOperation.READ_CHECKPOINT,\n"
              "                StrategyOperation.PULL_REMOTE,\n"
              "                StrategyOperation.PERSIST_REMOTE,\n"
              "            )\n"
              "        }",
          )

          inline_plan_pattern = (
              r"                StrategyOperation\.SERVE_LOCAL,\n"
              r"                StrategyOperation\.PULL_REMOTE,\n"
              r"                StrategyOperation\.PERSIST_REMOTE,"
          )
          inline_plan_replacement = (
              "                StrategyOperation.SERVE_LOCAL,\n"
              "                StrategyOperation.READ_CHECKPOINT,\n"
              "                StrategyOperation.PULL_REMOTE,\n"
              "                StrategyOperation.PERSIST_REMOTE,"
          )
          for path in (
              "dataloom-runtime/src/commonMain/kotlin/io/dataloom/runtime/strategy/CacheFirstStrategyExecutor.kt",
              "dataloom-runtime/src/commonMain/kotlin/io/dataloom/runtime/strategy/StrategySynchronizationExecutionCoordinator.kt",
              "dataloom-runtime/src/commonMain/kotlin/io/dataloom/runtime/strategy/StrategyCacheServedWithInlineRefreshResult.kt",
              "dataloom-runtime/src/commonTest/kotlin/io/dataloom/runtime/queue/StrategyQueueInlineRefreshSafetyTest.kt",
          ):
              regex_replace(path, inline_plan_pattern, inline_plan_replacement)

          for path in (
              "docs/api/provider-protected-strategy-execution.md",
              "docs/audits/DL-039B-inline-cache-refresh-runtime.md",
              "docs/strategies/cache-first.md",
          ):
              regex_replace(
                  path,
                  re.escape("SERVE_LOCAL → PULL_REMOTE → PERSIST_REMOTE"),
                  "SERVE_LOCAL → READ_CHECKPOINT → PULL_REMOTE → PERSIST_REMOTE",
              )

          runtime_test = (
              "dataloom-runtime/src/commonTest/kotlin/io/dataloom/runtime/strategy/"
              "CacheFirstInlineRefreshExecutionTest.kt"
          )
          regex_replace(
              runtime_test,
              r"        assertEquals\(StrategyDisposition\.SERVE_AND_REFRESH, served\.evaluation\.plan\.disposition\)\n"
              r"        assertEquals\(listOf\(StrategyOperation\.PULL_REMOTE\), refresh\.completedOperations\)",
              "        assertEquals(StrategyDisposition.SERVE_AND_REFRESH, served.evaluation.plan.disposition)\n"
              "        assertEquals(\n"
              "            listOf(\n"
              "                StrategyOperation.SERVE_LOCAL,\n"
              "                StrategyOperation.READ_CHECKPOINT,\n"
              "                StrategyOperation.PULL_REMOTE,\n"
              "                StrategyOperation.PERSIST_REMOTE,\n"
              "            ),\n"
              "            served.evaluation.plan.operations,\n"
              "        )\n"
              "        assertEquals(listOf(StrategyOperation.PULL_REMOTE), refresh.completedOperations)",
          )

          evaluator_test = (
              "dataloom-runtime/src/commonTest/kotlin/io/dataloom/runtime/strategy/"
              "BuiltInSynchronizationStrategyEvaluatorTest.kt"
          )
          anchor = "    @Test\n    fun cacheFirstRejectPolicyNeverServesStaleState() {"
          addition = """    @Test
          fun nonDurableCacheRefreshDeclaresCheckpointBeforeTransport() {
              val result = evaluate(
                  profile = CacheFirstStrategyProfile(
                      id = StrategyProfileId("cache-inline-refresh-plan"),
                      configurationVersion = version(),
                      refreshOnFreshHit = true,
                      requireDurableRefresh = false,
                  ),
                  direction = SynchronizationDirection.PULL,
                  evidence = evidence(
                      connectivity = StrategyConnectivity.AVAILABLE,
                      cacheState = StrategyCacheState.FRESH,
                  ),
              )

              assertEquals(StrategyDisposition.SERVE_AND_REFRESH, result.plan.disposition)
              assertEquals(
                  listOf(
                      StrategyOperation.SERVE_LOCAL,
                      StrategyOperation.READ_CHECKPOINT,
                      StrategyOperation.PULL_REMOTE,
                      StrategyOperation.PERSIST_REMOTE,
                  ),
                  result.plan.operations,
              )
              assertEquals(
                  setOf(
                      StrategyProviderCapability.STORAGE,
                      StrategyProviderCapability.CACHE_ACCESS,
                      StrategyProviderCapability.TRANSPORT,
                  ),
                  result.plan.requiredCapabilities,
              )
          }

          """ + anchor
          regex_replace(
              evaluator_test,
              re.escape(anchor),
              addition,
          )

          workflow = Path(
              ".github/workflows/inline-refresh-plan-correspondence-fix.yml"
          )
          workflow.unlink()
          PY

          git diff --check
          if git grep -n "SERVE_LOCAL → PULL_REMOTE → PERSIST_REMOTE" -- '*.md'; then
            echo "Undeclared-checkpoint documentation remains."
            exit 1
          fi
          if git grep -n -A2 "StrategyOperation.SERVE_LOCAL," -- \
              dataloom-runtime/src/commonMain/kotlin/io/dataloom/runtime/strategy/CacheFirstStrategyExecutor.kt \
              | grep -q "StrategyOperation.PULL_REMOTE"; then
            echo "Inline-refresh execution still permits an undeclared direct pull."
            exit 1
          fi

      - name: Commit correction and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "DL-039B: declare checkpoint read before inline refresh"
          git push origin "HEAD:${GITHUB_REF_NAME}"
