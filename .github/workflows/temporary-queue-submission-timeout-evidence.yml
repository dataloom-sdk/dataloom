name: Temporary Queue Submission Timeout Evidence

on:
  push:
    branches:
      - codex/dl-retry-024-queue-submission-timeouts
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: temporary-queue-submission-timeout-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-commit:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout review branch
        uses: actions/checkout@v6
        with:
          ref: codex/dl-retry-024-queue-submission-timeouts
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Patch builder integration, tests, and documentation
        run: python3 .github/scripts/temporary_queue_submission_timeout_patch.py

      - name: Compile and test queue-submission timeout assembly
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :dataloom-runtime:jvmTest \
            :dataloom-runtime:iosSimulatorArm64Test \
            :runtime-external-consumer:compileKotlinJvm \
            :runtime-external-consumer:compileKotlinIosArm64 \
            :runtime-external-consumer:compileKotlinIosSimulatorArm64 \
            :runtime-external-consumer:compileKotlinIosX64 \
            --configuration-cache \
            --stacktrace \
            --warning-mode all \
            --console=plain

      - name: Generate exact public ABI baselines
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :dataloom-runtime:updateKotlinAbi \
            :dataloom-apple:updateKotlinAbi \
            --no-configuration-cache \
            --stacktrace \
            --console=plain

      - name: Validate ABI and Apple framework
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :dataloom-runtime:checkKotlinAbi \
            :dataloom-runtime:checkPublicAbiBoundaries \
            :dataloom-apple:checkKotlinAbi \
            :runtime-external-consumer:checkRuntimeExternalConsumer \
            :dataloom-apple:assembleDataLoomReleaseXCFramework \
            --no-configuration-cache \
            --stacktrace \
            --warning-mode all \
            --console=plain

      - name: Verify generated queue-submission timeout evidence
        shell: bash
        run: |
          set -euo pipefail
          grep -F "DataLoomQueueSubmissionSpec" dataloom-runtime/api/dataloom-runtime.api
          grep -F "QueueSubmissionProviderTimeoutRuntime" dataloom-runtime/api/dataloom-runtime.api
          grep -F "queueSubmissionConfiguration" dataloom-runtime/api/dataloom-runtime.klib.api
          grep -F "queueSubmissionSpecValue" \
            dataloom-runtime/src/commonMain/kotlin/io/dataloom/runtime/facade/DataLoomBuilder.kt
          grep -F "Enqueue timeout boundary" docs/api/queue-submission.md
          test -d dataloom-apple/build/XCFrameworks/release/DataLoom.xcframework
          git diff --check

      - name: Commit generated evidence and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/temporary-queue-submission-timeout-evidence.yml \
            .github/scripts/temporary_queue_submission_timeout_patch.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No queue-submission timeout evidence to commit."
            exit 1
          fi
          git commit -m "DL-040: qualify queue-submission timeouts"
          git push origin HEAD:codex/dl-retry-024-queue-submission-timeouts
