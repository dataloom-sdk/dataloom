name: Temporary Provider Protected Queued Execution Evidence

on:
  push:
    branches:
      - codex/dl-retry-037-protected-queued-execution
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: temporary-provider-protected-queued-execution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-commit:
    runs-on: macos-15
    timeout-minutes: 50

    steps:
      - name: Checkout review branch
        uses: actions/checkout@v6
        with:
          ref: codex/dl-retry-037-protected-queued-execution
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Apply protected queued execution patch
        run: python3 .github/scripts/temporary_protected_queued_execution_patch.py

      - name: Index protected queued execution documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/api/README.md")
          text = path.read_text()
          row = "| [Provider-protected queued execution](./provider-protected-queued-execution.md) | Partial V1 subsystem | Exact explicit bindings, queue outcomes, and ordered provider/circuit evidence for one acquired entry. |"
          if row not in text:
              anchor = "| [Queued synchronization execution](./queued-synchronization-execution.md) | Available foundation | Queue-entry resolution, synchronization execution, and retry evaluation. |"
              if anchor not in text:
                  raise SystemExit("Queued synchronization documentation anchor not found")
              text = text.replace(anchor, anchor + "\n" + row, 1)
          path.write_text(text)
          PY

      - name: Compile and test protected queued execution
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :dataloom-runtime:jvmTest \
            :dataloom-runtime:iosSimulatorArm64Test \
            :runtime-external-consumer:compileKotlinJvm \
            :runtime-external-consumer:compileKotlinIosArm64 \
            :runtime-external-consumer:compileKotlinIosSimulatorArm64 \
            :runtime-external-consumer:compileKotlinIosX64 \
            --configuration-cache \
            --stacktrace \
            --warning-mode all \
            --console=plain

      - name: Generate exact public ABI baselines
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :dataloom-runtime:updateKotlinAbi \
            :dataloom-apple:updateKotlinAbi \
            --no-configuration-cache \
            --stacktrace \
            --console=plain

      - name: Validate ABI consumers and Apple framework
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :dataloom-runtime:checkKotlinAbi \
            :dataloom-runtime:checkPublicAbiBoundaries \
            :dataloom-apple:checkKotlinAbi \
            :runtime-external-consumer:checkRuntimeExternalConsumer \
            :dataloom-apple:assembleDataLoomReleaseXCFramework \
            --no-configuration-cache \
            --stacktrace \
            --warning-mode all \
            --console=plain

      - name: Verify generated protected queued execution evidence
        shell: bash
        run: |
          set -euo pipefail
          grep -F "ProviderProtectedQueuedSynchronizationExecutionHandler" \
            dataloom-runtime/api/dataloom-runtime.api
          grep -F "ProviderProtectedQueueEntryExecutionResult" \
            dataloom-runtime/api/dataloom-runtime.klib.api
          grep -F "synchronize" dataloom-runtime/api/dataloom-runtime.api | \
            grep -F "SynchronizationProviderBindings"
          grep -F "ProviderProtectedQueuedExecutionExternalConsumerProbe" \
            runtime-external-consumer/src/commonMain/kotlin/io/dataloom/consumer/ProviderProtectedQueuedExecutionExternalConsumerProbe.kt
          grep -F "provider-protected-queued-execution.md" docs/api/README.md
          test -d dataloom-apple/build/XCFrameworks/release/DataLoom.xcframework
          git diff --check

      - name: Commit generated evidence and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/temporary-provider-protected-queued-execution-evidence.yml \
            .github/scripts/temporary_protected_queued_execution_patch.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No protected queued execution evidence to commit."
            exit 1
          fi
          git commit -m "DL-040: qualify provider-protected queued execution"
          git push origin HEAD:codex/dl-retry-037-protected-queued-execution
