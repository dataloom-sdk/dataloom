name: DL-040 Apple Circuit Store Evidence

on:
  push:
    branches:
      - codex/dl-retry-043-apple-circuit-store

permissions:
  contents: write

jobs:
  qualify-apple-circuit-store:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v6
        with:
          ref: codex/dl-retry-043-apple-circuit-store
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply reviewed Kotlin Native and descriptor-lifecycle corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("dataloom-runtime/src/iosMain/kotlin/io/dataloom/runtime/retry/AppleFileCircuitBreakerStateStore.kt")
          source = path.read_text()
          replacements = (
              ("            records.toSortedMap().forEach { (key, record) ->\n                check(key == scopeStorageKey(record.state.scope)) {", "            records.entries.sortedBy { it.key }.forEach { entry ->\n                val key = entry.key\n                val record = entry.value\n                check(key == scopeStorageKey(record.state.scope)) {", "deterministic ordering"),
              ("mkdir(current, S_IRWXU)", "mkdir(current, S_IRWXU.convert())", "mkdir mode conversion"),
              ("    var committed = false", "    var descriptorOpen = true\n    var renamed = false", "descriptor state"),
              ("        if (close(descriptor) != 0) throw AppleCircuitFileException()", "        val closeResult = close(descriptor)\n        descriptorOpen = false\n        if (closeResult != 0) throw AppleCircuitFileException()", "single close result"),
              ("        committed = true", "        renamed = true", "rename completion"),
              ("        if (!committed) {\n            close(descriptor)\n            unlink(temporaryPath)\n        }", "        if (descriptorOpen) {\n            close(descriptor)\n        }\n        if (!renamed) {\n            unlink(temporaryPath)\n        }", "failure cleanup"),
          )
          for old, new, label in replacements:
              if source.count(old) != 1:
                  raise SystemExit(f"expected exactly one {label} source occurrence")
              source = source.replace(old, new)
          path.write_text(source)
          PY

      - name: Qualify runtime, external consumers, ABI, and XCFramework
        run: |
          chmod +x gradlew
          ./gradlew \
            :dataloom-runtime:jvmTest \
            :dataloom-runtime:iosSimulatorArm64Test \
            :runtime-external-consumer:compileKotlinJvm \
            :runtime-external-consumer:compileKotlinIosArm64 \
            :runtime-external-consumer:compileKotlinIosSimulatorArm64 \
            :runtime-external-consumer:compileKotlinIosX64 \
            --configuration-cache \
            --stacktrace \
            --console=plain
          ./gradlew \
            :dataloom-runtime:updateKotlinAbi \
            :dataloom-apple:updateKotlinAbi \
            --no-configuration-cache \
            --stacktrace \
            --console=plain
          ./gradlew \
            :dataloom-runtime:checkKotlinAbi \
            :dataloom-runtime:checkPublicAbiBoundaries \
            :dataloom-apple:checkKotlinAbi \
            :runtime-external-consumer:checkRuntimeExternalConsumer \
            :dataloom-apple:assembleDataLoomReleaseXCFramework \
            --no-configuration-cache \
            --warning-mode all \
            --stacktrace \
            --console=plain

      - name: Commit source corrections and exact evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dl-040-apple-circuit-store-evidence.yml
          git add \
            dataloom-runtime/src/iosMain/kotlin/io/dataloom/runtime/retry/AppleFileCircuitBreakerStateStore.kt \
            dataloom-runtime/api/dataloom-runtime.api \
            dataloom-runtime/api/dataloom-runtime.klib.api \
            dataloom-apple/api/dataloom-apple.klib.api
          git diff --check
          git commit -m "DL-040: qualify Apple circuit state persistence"
          git push origin HEAD:codex/dl-retry-043-apple-circuit-store
