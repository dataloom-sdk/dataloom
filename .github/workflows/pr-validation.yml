name: Pull Request Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: idempotent-queue-admission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Implement and qualify idempotent queue admission
    if: >-
      github.head_ref == 'agent/dl-strategy-017-idempotent-queue-admission' &&
      github.actor != 'github-actions[bot]'
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Apply provider and documentation implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              file.write_text(text.replace(old, new))

          # In-memory testing provider.
          path = "dataloom-testing/src/commonMain/kotlin/io/dataloom/testing/queue/InMemoryQueueProvider.kt"
          replace_once(
              path,
              """import io.dataloom.api.queue.QueueEntry
          import io.dataloom.api.queue.QueueEntryState
          import io.dataloom.api.queue.QueueEnqueueRequest
          """,
              """import io.dataloom.api.queue.QueueEntry
          import io.dataloom.api.queue.QueueEntryState
          import io.dataloom.api.queue.QueueEnqueueRequest
          import io.dataloom.api.queue.QueueIdempotentAdmissionProvider
          import io.dataloom.api.queue.QueueIdempotentAdmissionResult
          import io.dataloom.api.queue.hasSameQueueAdmissionIdentityAs
          """,
          )
          replace_once(path, ") : QueueProvider {", ") : QueueIdempotentAdmissionProvider {")
          replace_once(
              path,
              """    override suspend fun enqueue(
                  request: QueueEnqueueRequest,
              ): ProviderOperationResult<Unit> {
          """,
              """    override suspend fun admit(
                  request: QueueEnqueueRequest,
              ): ProviderOperationResult<QueueIdempotentAdmissionResult> {
                  val candidate = request.entry.copy(lastError = null)
                  val current = entries[candidate.id]
                  if (current != null) {
                      val result = if (current.hasSameQueueAdmissionIdentityAs(candidate)) {
                          QueueIdempotentAdmissionResult.AlreadyAccepted(
                              queueEntryId = current.id,
                              currentState = current.state,
                          )
                      } else {
                          QueueIdempotentAdmissionResult.IdentityConflict(
                              queueEntryId = current.id,
                              currentState = current.state,
                          )
                      }
                      return ProviderOperationResult.Success(result)
                  }
                  entries[candidate.id] = candidate
                  return ProviderOperationResult.Success(
                      QueueIdempotentAdmissionResult.Accepted(candidate.id),
                  )
              }

              override suspend fun enqueue(
                  request: QueueEnqueueRequest,
              ): ProviderOperationResult<Unit> {
          """,
          )

          # Android Room provider.
          path = "dataloom-queue-room/src/main/kotlin/io/dataloom/queue/room/RoomQueueProvider.kt"
          replace_once(
              path,
              """import io.dataloom.api.queue.QueueEnqueueRequest
          import io.dataloom.api.queue.QueueFailureDisposition
          """,
              """import io.dataloom.api.queue.QueueEnqueueRequest
          import io.dataloom.api.queue.QueueFailureDisposition
          import io.dataloom.api.queue.QueueIdempotentAdmissionProvider
          import io.dataloom.api.queue.QueueIdempotentAdmissionResult
          """,
          )
          replace_once(path, ") : QueueProvider {", ") : QueueIdempotentAdmissionProvider {")
          replace_once(
              path,
              """    /** Persists one new queue entry. */
              override suspend fun enqueue(
          """,
              """    /** Atomically creates or reconciles one stable durable identity. */
              override suspend fun admit(
                  request: QueueEnqueueRequest,
              ): ProviderOperationResult<QueueIdempotentAdmissionResult> =
                  executeDatabaseOperation {
                      ProviderOperationResult.Success(dao.admitEntry(request.entry))
                  }

              /** Persists one new queue entry. */
              override suspend fun enqueue(
          """,
          )

          # Room DAO transaction.
          path = "dataloom-queue-room/src/main/kotlin/io/dataloom/queue/room/internal/QueueEntryDao.kt"
          replace_once(
              path,
              """import io.dataloom.api.queue.QueueEntry
          """,
              """import io.dataloom.api.queue.QueueEntry
          import io.dataloom.api.queue.QueueIdempotentAdmissionResult
          import io.dataloom.api.queue.hasSameQueueAdmissionIdentityAs
          """,
          )
          replace_once(
              path,
              """    @Insert(onConflict = OnConflictStrategy.ABORT)
              abstract suspend fun insert(entity: QueueEntryEntity)
          """,
              """    @Insert(onConflict = OnConflictStrategy.ABORT)
              abstract suspend fun insert(entity: QueueEntryEntity)

              @Insert(onConflict = OnConflictStrategy.IGNORE)
              protected abstract suspend fun insertIfAbsent(entity: QueueEntryEntity): Long

              @Query(
                  \"\"\"
                  SELECT * FROM queue_entries
                  WHERE entry_id = :entryId
                  LIMIT 1
                  \"\"\",
              )
              protected abstract suspend fun selectById(entryId: String): QueueEntryEntity?

              /** Creates or reconciles one immutable queue identity in one transaction. */
              @Transaction
              open suspend fun admitEntry(entry: QueueEntry): QueueIdempotentAdmissionResult {
                  val candidate = entry.copy(lastError = null)
                  val insertedRowId = insertIfAbsent(candidate.toEntity())
                  if (insertedRowId != -1L) {
                      return QueueIdempotentAdmissionResult.Accepted(candidate.id)
                  }
                  val current = checkNotNull(selectById(candidate.id.value)) {
                      \"Conflicting queue row disappeared during idempotent admission.\"
                  }.toDomain()
                  return if (current.hasSameQueueAdmissionIdentityAs(candidate)) {
                      QueueIdempotentAdmissionResult.AlreadyAccepted(
                          queueEntryId = current.id,
                          currentState = current.state,
                      )
                  } else {
                      QueueIdempotentAdmissionResult.IdentityConflict(
                          queueEntryId = current.id,
                          currentState = current.state,
                      )
                  }
              }
          """,
          )

          # Apple file-backed provider.
          path = "dataloom-runtime/src/iosMain/kotlin/io/dataloom/runtime/queue/AppleFileQueueProvider.kt"
          replace_once(
              path,
              """import io.dataloom.api.queue.QueueEntry
          import io.dataloom.api.queue.QueueEntryState
          import io.dataloom.api.queue.QueueFailureDisposition
          """,
              """import io.dataloom.api.queue.QueueEntry
          import io.dataloom.api.queue.QueueEntryState
          import io.dataloom.api.queue.QueueFailureDisposition
          import io.dataloom.api.queue.QueueIdempotentAdmissionProvider
          import io.dataloom.api.queue.QueueIdempotentAdmissionResult
          import io.dataloom.api.queue.hasSameQueueAdmissionIdentityAs
          """,
          )
          replace_once(path, ") : QueueProvider {", ") : QueueIdempotentAdmissionProvider {")
          replace_once(
              path,
              """    override suspend fun enqueue(
                  request: QueueEnqueueRequest,
              ): ProviderOperationResult<Unit> = appleQueueExecute {
          """,
              """    override suspend fun admit(
                  request: QueueEnqueueRequest,
              ): ProviderOperationResult<QueueIdempotentAdmissionResult> = appleQueueExecute {
                  appleQueueWithExclusiveLock {
                      val snapshot = appleQueueReadSnapshot()
                      val entries = snapshot.entries
                      val candidate = request.entry.copy(lastError = null)
                      val current = entries[candidate.id.value]
                      if (current != null) {
                          val result = if (current.hasSameQueueAdmissionIdentityAs(candidate)) {
                              QueueIdempotentAdmissionResult.AlreadyAccepted(
                                  queueEntryId = current.id,
                                  currentState = current.state,
                              )
                          } else {
                              QueueIdempotentAdmissionResult.IdentityConflict(
                                  queueEntryId = current.id,
                                  currentState = current.state,
                              )
                          }
                          return@appleQueueWithExclusiveLock ProviderOperationResult.Success(result)
                      }
                      if (entries.size >= APPLE_QUEUE_MAX_ENTRY_COUNT) {
                          throw AppleQueueEntryLimitException()
                      }
                      entries[candidate.id.value] = candidate
                      currentCoroutineContext().ensureActive()
                      appleQueueWriteSnapshot(snapshot)
                      ProviderOperationResult.Success(
                          QueueIdempotentAdmissionResult.Accepted(candidate.id),
                      )
                  }
              }

              override suspend fun enqueue(
                  request: QueueEnqueueRequest,
              ): ProviderOperationResult<Unit> = appleQueueExecute {
          """,
          )

          # Audit index.
          path = "docs/audits/README.md"
          replace_once(
              path,
              """| Audit | Scope | How to use it |
          |---|---|---|
          | [DL-039B inline cache refresh runtime](./DL-039B-inline-cache-refresh-runtime.md) | Exact non-durable cache-first PULL local-serving plus canonical inline refresh composition | Candidate runtime checkpoint; ABI and permanent shared/Android/Apple qualification remain required before acceptance on `main` |
          """,
              """| Audit | Scope | How to use it |
          |---|---|---|
          | [DL-039B idempotent queue admission](./DL-039B-idempotent-queue-admission.md) | Atomic first/already/conflict durable identity across in-memory, Room, and Apple queue providers | Current prerequisite for durable refresh admission; runtime scheduling and recovery remain under #102/#101 |
          | [DL-039B inline cache refresh runtime](./DL-039B-inline-cache-refresh-runtime.md) | Exact non-durable cache-first PULL local-serving plus canonical inline refresh composition | Accepted foreground runtime checkpoint; durable admission/recovery and complete platform matrices remain under #102/#101 |
          """,
          )

          # Queue-provider guide.
          path = "docs/api/queue-provider.md"
          replace_once(
              path,
              """> **Status:** Available SPI with a Room implementation and in-memory test
          > provider. Constraint deferral and expired-lease recovery preserve retry
          > attempt history; complete retry/circuit state and V1 persistence
          > qualification remain open.
          """,
              """> **Status:** Available SPI with in-memory, Android Room, and Apple file-backed
          > implementations. An additive idempotent admission capability provides typed
          > first/already/conflict reconciliation without changing ordinary enqueue.
          > Complete strategy recovery and platform qualification remain open.
          """,
          )
          replace_once(
              path,
              """}
          ```

          ---

          ## Descriptor
          """,
              """}

          public interface QueueIdempotentAdmissionProvider : QueueProvider {
              suspend fun admit(
                  request: QueueEnqueueRequest,
              ): ProviderOperationResult<QueueIdempotentAdmissionResult>
          }
          ```

          `QueueIdempotentAdmissionProvider` is additive. Existing providers and
          callers retain create-only `enqueue` behavior unless they explicitly select
          the idempotent admission SPI.

          ---

          ## Descriptor
          """,
          )
          replace_once(
              path,
              """### `acquire`
          """,
              """### `admit` — additive idempotent capability

          ```kotlin
          suspend fun admit(
              request: QueueEnqueueRequest,
          ): ProviderOperationResult<QueueIdempotentAdmissionResult>
          ```

          `admit` is available only through `QueueIdempotentAdmissionProvider`.
          Under one provider-owned atomic boundary it returns:

          - `Accepted` when the stable ID was absent and the entry was persisted;
          - `AlreadyAccepted` with the current durable state when the same immutable
            admission identity already exists; or
          - `IdentityConflict` when the same ID belongs to different immutable work.

          Immutable identity includes the synchronization request, entry metadata,
          workflow timeout, strategy decision, and accepted plan. Lifecycle state,
          timestamps, retry state, lease, and last error are excluded because they
          legitimately change after admission.

          Providers do not parse duplicate errors, replace existing work, call a
          scheduler, or expose the existing entry. Ordinary I/O, corruption, capacity,
          and indeterminate outcomes remain canonical provider failures.

          ### `acquire`
          """,
          )

          # Main dashboard, percentage deliberately unchanged.
          path = "README.md"
          replace_once(
              path,
              """succeeded, failed, or cancelled refresh evidence. Non-offline direct deferrals
          fail closed until their queue or scheduler admission is implemented. Durable
          refresh recovery, accepted-plan refresh replay, BIDIRECTIONAL inline refresh,
          """,
              """succeeded, failed, or cancelled refresh evidence. Queue providers now expose
          typed atomic first/already/conflict admission across in-memory, Room, and
          Apple persistence without changing ordinary enqueue. Non-offline direct
          deferrals still fail closed until the strategy runtime owns queue and
          scheduler admission. Durable refresh recovery, accepted-plan refresh replay,
          BIDIRECTIONAL inline refresh,
          """,
          )
          replace_once(
              path,
              """exact non-durable PULL inline refresh composition with local freshness plus completed/partial/failed/cancelled evidence; explicit freshness-drift and partial-effect outcomes; and fail-closed non-atomic direct deferrals | Complete online offline-first execution ownership and platform implementations with crash/relaunch proof; add durable refresh admission/deduplication/recovery, accepted-plan refresh replay, BIDIRECTIONAL inline refresh, hybrid coherence/conflict application, durable strategy events/diagnostics, and the full native Android/KMP Android/KMP iOS failure/restart matrix |
          """,
              """exact non-durable PULL inline refresh composition with local freshness plus completed/partial/failed/cancelled evidence; typed idempotent queue admission across in-memory, Room, and Apple providers; explicit freshness-drift and partial-effect outcomes; and fail-closed non-atomic direct deferrals | Complete online offline-first execution ownership and platform implementations with crash/relaunch proof; compose durable refresh queue/scheduler admission and recovery from the idempotent foundation, add accepted-plan refresh replay, BIDIRECTIONAL inline refresh, hybrid coherence/conflict application, durable strategy events/diagnostics, and the full native Android/KMP Android/KMP iOS failure/restart matrix |
          """,
          )
          PY

          git diff --check
          if git diff --name-only | grep -E '(^|/)(build\.gradle|build\.gradle\.kts|settings\.gradle|settings\.gradle\.kts|libs\.versions\.toml)$'; then
            echo "Dependency or build configuration changed unexpectedly."
            exit 1
          fi

      - name: Generate authoritative public ABI baselines
        run: >-
          ./gradlew
          :dataloom-api:updateKotlinAbi
          :dataloom-runtime:updateKotlinAbi
          :dataloom-testing:updateKotlinAbi
          --configuration-cache
          --stacktrace
          --console=plain

      - name: Run shared and Apple qualification
        run: >-
          ./gradlew
          :build-logic:test
          build
          :dataloom-api:iosSimulatorArm64Test
          :dataloom-runtime:iosSimulatorArm64Test
          :dataloom-testing:iosSimulatorArm64Test
          :runtime-external-consumer:checkRuntimeExternalConsumer
          :runtime-external-consumer:compileKotlinIosArm64
          :runtime-external-consumer:compileKotlinIosSimulatorArm64
          :runtime-external-consumer:compileKotlinIosX64
          --configuration-cache
          --stacktrace
          --console=plain

      - name: Restore permanent validation workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/pr-validation.yml \
            > .github/workflows/pr-validation.yml
          git diff --check

      - name: Commit qualified implementation and ABI evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "DL-039B: implement idempotent queue admission"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
