name: Pull Request Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dl-strategy-018-qualification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Qualify durable cache refresh admission
    if: github.head_ref == 'agent/dl-strategy-018-durable-cache-refresh-admission'
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Apply reviewed durable-refresh candidate
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          source_path = Path("tools/agent/dl-strategy-018.patch")
          source = source_path.read_text()
          target = (
              "dataloom-runtime/src/commonMain/kotlin/io/dataloom/runtime/strategy/"
              "CacheFirstStrategyExecutor.kt"
          )
          marker = f"diff --git a/{target} b/{target}\n"
          start = source.find(marker)
          if start < 0:
              raise SystemExit("Missing CacheFirstStrategyExecutor patch section")
          end = source.find("\ndiff --git ", start + len(marker))
          section = source[start:] if end < 0 else source[start:end]
          Path("/tmp/cache-first-executor.patch").write_text(section.rstrip() + "\n")
          PY

          # All other production/test/audit files still match their reviewed
          # patch context. README and the cache-first guide are reconciled only
          # after the source candidate is qualified, so documentation drift
          # cannot block compilation evidence.
          git apply --recount \
            --exclude=dataloom-runtime/src/commonMain/kotlin/io/dataloom/runtime/strategy/CacheFirstStrategyExecutor.kt \
            --exclude=docs/strategies/cache-first.md \
            --exclude=README.md \
            tools/agent/dl-strategy-018.patch

          # This executor's base blob is unchanged, but one generated hunk has
          # stale line-count metadata. BSD patch safely applies the reviewed
          # file section with bounded fuzz; compilation and tests validate it.
          patch -p1 -F 3 -f < /tmp/cache-first-executor.patch
          if find . -name '*.rej' -print -quit | grep -q .; then
            echo "Cache executor patch left rejected hunks."
            find . -name '*.rej' -print
            exit 1
          fi
          find . -name '*.orig' -delete
          rm tools/agent/dl-strategy-018.patch

          git checkout origin/main -- \
            .github/workflows/pr-validation.yml \
            .github/workflows/android-validation.yml \
            .github/workflows/apple-validation.yml

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "dataloom-testing/src/commonTest/kotlin/io/dataloom/testing/strategy/"
              "CacheFirstDurableRefreshAdmissionIntegrationTest.kt"
          )
          text = path.read_text()
          old_import = "import kotlinx.coroutines.test.runTest\n"
          if text.count(old_import) != 1:
              raise SystemExit("Expected exactly one runTest import")
          text = text.replace(
              old_import,
              "import kotlin.coroutines.Continuation\n"
              "import kotlin.coroutines.EmptyCoroutineContext\n"
              "import kotlin.coroutines.startCoroutine\n",
          )
          count = text.count("= runTest {")
          if count == 0:
              raise SystemExit("Expected durable-refresh runTest usages")
          text = text.replace("= runTest {", "= runSuspend {")

          marker = "    private companion object {\n"
          if text.count(marker) != 1:
              raise SystemExit("Expected one companion-object insertion point")
          helper = (
              "    /** Runs the deterministic, immediately completing suspend test body. */\n"
              "    private fun <T> runSuspend(block: suspend () -> T): T {\n"
              "        var outcome: Result<T>? = null\n"
              "        block.startCoroutine(\n"
              "            object : Continuation<T> {\n"
              "                override val context = EmptyCoroutineContext\n"
              "\n"
              "                override fun resumeWith(result: Result<T>) {\n"
              "                    outcome = result\n"
              "                }\n"
              "            },\n"
              "        )\n"
              "        return requireNotNull(outcome) {\n"
              "            \"Durable refresh test operation did not complete synchronously.\"\n"
              "        }.getOrThrow()\n"
              "    }\n"
              "\n"
          )
          path.write_text(text.replace(marker, helper + marker))
          PY

          git diff --check

      - name: Generate authoritative public ABI baselines
        run: >-
          ./gradlew
          :dataloom-api:updateKotlinAbi
          :dataloom-runtime:updateKotlinAbi
          --configuration-cache
          --stacktrace
          --console=plain

      - name: Run shared, Native, and external-consumer qualification
        run: >-
          ./gradlew
          :build-logic:test
          build
          :dataloom-runtime:iosSimulatorArm64Test
          :dataloom-testing:iosSimulatorArm64Test
          :runtime-external-consumer:checkRuntimeExternalConsumer
          :runtime-external-consumer:compileKotlinIosArm64
          :runtime-external-consumer:compileKotlinIosSimulatorArm64
          :runtime-external-consumer:compileKotlinIosX64
          :dataloom-apple:assembleDataLoomReleaseXCFramework
          --configuration-cache
          --stacktrace
          --console=plain

      - name: Run Android static qualification
        env:
          DATALOOM_ANDROID_BUILD: "true"
        run: >-
          ./gradlew
          projects
          :dataloom-connectivity-android:assembleDebug
          :dataloom-connectivity-android:testDebugUnitTest
          :dataloom-scheduler-workmanager:assembleDebug
          :dataloom-scheduler-workmanager:testDebugUnitTest
          :dataloom-queue-room:kspDebugKotlin
          :dataloom-queue-room:assembleDebug
          :dataloom-queue-room:assembleDebugAndroidTest
          :dataloom-queue-room:testDebugUnitTest
          :runtime-external-consumer:checkRuntimeExternalConsumer
          --configuration-cache
          --stacktrace
          --console=plain
          --max-workers=1

      - name: Assemble qualified candidate artifact
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

          git diff --name-only --diff-filter=ACMRT origin/main -- > candidate-files.txt
          if [[ ! -s candidate-files.txt ]]; then
            echo "No candidate files were produced."
            exit 1
          fi
          if grep -E '^\.github/workflows/|^tools/agent/' candidate-files.txt; then
            echo "Temporary qualification files leaked into the candidate."
            exit 1
          fi
          if grep -E '(^|/)(build\.gradle(\.kts)?|settings\.gradle(\.kts)?|libs\.versions\.toml)$' \
              candidate-files.txt; then
            echo "Dependency or build configuration changed unexpectedly."
            exit 1
          fi

          mkdir -p candidate
          while IFS= read -r file; do
            mkdir -p "candidate/$(dirname "$file")"
            cp "$file" "candidate/$file"
          done < candidate-files.txt
          cp candidate-files.txt candidate/CANDIDATE_FILES.txt
          git diff --stat origin/main > candidate/DIFFSTAT.txt
          git diff --binary origin/main > candidate/CANDIDATE.patch

      - name: Upload qualified candidate
        uses: actions/upload-artifact@v7
        with:
          name: dl-strategy-018-qualified-candidate
          path: candidate
          if-no-files-found: error
          retention-days: 3
