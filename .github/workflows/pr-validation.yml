name: Pull Request Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: dl-strategy-018-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Apply and qualify durable cache refresh admission
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Apply reviewed durable-refresh patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --recount --check tools/agent/dl-strategy-018.patch
          git apply --recount tools/agent/dl-strategy-018.patch
          rm tools/agent/dl-strategy-018.patch
          rm -f .github/workflows/dl-strategy-018-apply.yml

          # Keep dataloom-testing dependency-neutral. These deterministic test
          # providers complete synchronously, so standard Kotlin continuations
          # are sufficient and no kotlinx-coroutines-test dependency is added.
          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "dataloom-testing/src/commonTest/kotlin/io/dataloom/testing/strategy/"
              "CacheFirstDurableRefreshAdmissionIntegrationTest.kt"
          )
          text = path.read_text()
          old_import = "import kotlinx.coroutines.test.runTest\n"
          if text.count(old_import) != 1:
              raise SystemExit("Expected exactly one runTest import")
          text = text.replace(
              old_import,
              "import kotlin.coroutines.Continuation\n"
              "import kotlin.coroutines.EmptyCoroutineContext\n"
              "import kotlin.coroutines.startCoroutine\n",
          )
          test_count = text.count("= runTest {")
          if test_count == 0:
              raise SystemExit("Expected durable-refresh runTest usages")
          text = text.replace("= runTest {", "= runSuspend {")

          marker = "    private companion object {\n"
          if text.count(marker) != 1:
              raise SystemExit("Expected one companion-object insertion point")
          helper = (
              "    /** Runs the deterministic, immediately completing suspend test body. */\n"
              "    private fun <T> runSuspend(block: suspend () -> T): T {\n"
              "        var outcome: Result<T>? = null\n"
              "        block.startCoroutine(\n"
              "            object : Continuation<T> {\n"
              "                override val context = EmptyCoroutineContext\n"
              "\n"
              "                override fun resumeWith(result: Result<T>) {\n"
              "                    outcome = result\n"
              "                }\n"
              "            },\n"
              "        )\n"
              "        return requireNotNull(outcome) {\n"
              "            \"Durable refresh test operation did not complete synchronously.\"\n"
              "        }.getOrThrow()\n"
              "    }\n"
              "\n"
          )
          text = text.replace(marker, helper + marker)
          path.write_text(text)
          PY

          git diff --check

      - name: Generate authoritative public ABI baselines
        run: >-
          ./gradlew
          :dataloom-api:updateKotlinAbi
          :dataloom-runtime:updateKotlinAbi
          --configuration-cache
          --stacktrace
          --console=plain

      - name: Run shared native and external-consumer qualification
        run: >-
          ./gradlew
          :build-logic:test
          build
          :dataloom-runtime:iosSimulatorArm64Test
          :dataloom-testing:iosSimulatorArm64Test
          :runtime-external-consumer:checkRuntimeExternalConsumer
          :runtime-external-consumer:compileKotlinIosArm64
          :runtime-external-consumer:compileKotlinIosSimulatorArm64
          :runtime-external-consumer:compileKotlinIosX64
          --configuration-cache
          --stacktrace
          --console=plain

      - name: Restore permanent validation workflow
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/pr-validation.yml

      - name: Verify candidate tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e tools/agent/dl-strategy-018.patch
          test ! -e .github/workflows/dl-strategy-018-apply.yml
          if git diff --name-only origin/main...HEAD -- \
              build.gradle build.gradle.kts settings.gradle settings.gradle.kts \
              gradle/libs.versions.toml | grep -q .; then
            echo "Dependency or build configuration changed unexpectedly."
            exit 1
          fi

      - name: Commit qualified durable-refresh implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "DL-039B: admit durable cache refresh work"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
