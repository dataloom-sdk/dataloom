name: Pull Request Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Validate build, tests, ABI, and external consumer
        run: >-
          ./gradlew
          :build-logic:test
          build
          :runtime-external-consumer:checkRuntimeExternalConsumer
          --configuration-cache
          --stacktrace
          --console=plain

  circuit-evidence:
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/dl-retry-015-circuit-state-machine'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DATALOOM_ANDROID_BUILD: "true"

    steps:
      - name: Checkout review branch
        uses: actions/checkout@v6
        with:
          ref: codex/dl-retry-015-circuit-state-machine
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Apply final circuit integration
        run: |
          python3 .github/scripts/apply_circuit_state_evidence.py
          git diff --check

      - name: Generate exact ABI baselines
        run: >-
          ./gradlew
          :dataloom-api:updateKotlinAbi
          :dataloom-runtime:updateKotlinAbi
          :dataloom-apple:updateKotlinAbi
          --configuration-cache
          --stacktrace
          --console=plain

      - name: Validate circuit state slice
        run: >-
          ./gradlew
          :build-logic:test
          :dataloom-api:jvmTest
          :dataloom-runtime:jvmTest
          :runtime-external-consumer:compileKotlinJvm
          :runtime-external-consumer:compileKotlinIosArm64
          :runtime-external-consumer:compileKotlinIosSimulatorArm64
          :runtime-external-consumer:compileKotlinIosX64
          :dataloom-apple:assembleDataLoomReleaseXCFramework
          --configuration-cache
          --stacktrace
          --warning-mode
          all
          --console=plain

      - name: Verify generated public evidence
        run: |
          grep -q 'CircuitBreakerScope' dataloom-api/api/dataloom-api.api
          grep -q 'CircuitBreakerCoordinator' dataloom-runtime/api/dataloom-runtime.api
          grep -q 'CircuitBreakerCoordinator' dataloom-runtime/api/dataloom-runtime.klib.api

      - name: Restore permanent workflow and commit evidence
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/pr-validation.yml
          rm -f .github/workflows/temporary-circuit-state-evidence.yml
          rm -f .github/scripts/apply_circuit_state_evidence.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'DL-040: integrate circuit state evidence'
          git push origin HEAD:codex/dl-retry-015-circuit-state-machine
