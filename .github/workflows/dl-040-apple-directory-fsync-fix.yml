name: DL-040 Apple Directory Durability Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify-directory-fsync:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/dl-retry-043-apple-circuit-store'
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply parent-directory durability correction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("dataloom-runtime/src/iosMain/kotlin/io/dataloom/runtime/retry/AppleFileCircuitBreakerStateStore.kt")
          source = source_path.read_text()
          old_class_doc = "Successful writes are fsynced to a temporary file and atomically renamed over\n * the prior snapshot. Compare-and-set therefore remains exact across multiple"
          new_class_doc = "Successful writes are fsynced to a temporary file, atomically renamed over the\n * prior snapshot, and followed by a parent-directory fsync. Compare-and-set\n * therefore remains exact across multiple"
          old_rename = "        if (rename(temporaryPath, destinationPath) != 0) {\n            throw AppleCircuitFileException()\n        }\n        renamed = true"
          new_rename = "        if (rename(temporaryPath, destinationPath) != 0) {\n            throw AppleCircuitFileException()\n        }\n        renamed = true\n        fsyncDirectory(destinationPath.substringBeforeLast('/'))"
          marker = "\nprivate object AppleCircuitStoreError {"
          helper = "\nprivate fun fsyncDirectory(path: String) {\n    val descriptor = open(path, O_RDONLY)\n    if (descriptor < 0) throw AppleCircuitFileException()\n    var descriptorOpen = true\n    try {\n        if (fsync(descriptor) != 0) throw AppleCircuitFileException()\n        val closeResult = close(descriptor)\n        descriptorOpen = false\n        if (closeResult != 0) throw AppleCircuitFileException()\n    } finally {\n        if (descriptorOpen) {\n            close(descriptor)\n        }\n    }\n}\n"
          for old, new, label in (
              (old_class_doc, new_class_doc, "class durability documentation"),
              (old_rename, new_rename, "rename durability boundary"),
          ):
              if source.count(old) != 1:
                  raise SystemExit(f"expected exactly one {label} occurrence")
              source = source.replace(old, new)
          if source.count(marker) != 1:
              raise SystemExit("expected exactly one error-object insertion marker")
          source_path.write_text(source.replace(marker, helper + marker))

          doc_path = Path("docs/apple/circuit-state-store.md")
          doc = doc_path.read_text()
          replacements = (
              ("A successful update writes a complete temporary snapshot, calls `fsync`,\nand atomically renames the temporary file over the previous snapshot.", "A successful update writes a complete temporary snapshot, calls `fsync`,\natomically renames the temporary file over the previous snapshot, and then\nfsyncs the parent directory so the renamed directory entry is durable."),
              ("        Store->>Disk: write temp + fsync + atomic rename", "        Store->>Disk: write temp + fsync + atomic rename + directory fsync"),
          )
          for old, new in replacements:
              if doc.count(old) != 1:
                  raise SystemExit("expected Apple circuit-store documentation text not found")
              doc = doc.replace(old, new)
          doc_path.write_text(doc)

          audit_path = Path("docs/audits/DL-040-apple-file-circuit-store-checkpoint.md")
          audit = audit_path.read_text()
          old = "7. A successful result is returned only after the replacement snapshot is\n   fsynced and atomically renamed."
          new = "7. A successful result is returned only after the replacement snapshot is\n   fsynced, atomically renamed, and the parent directory is fsynced."
          if audit.count(old) != 1:
              raise SystemExit("expected checkpoint durability invariant not found")
          audit_path.write_text(audit.replace(old, new))
          PY

      - name: Verify Apple runtime and external consumers
        run: |
          chmod +x gradlew
          ./gradlew \
            :dataloom-runtime:iosSimulatorArm64Test \
            :runtime-external-consumer:compileKotlinIosArm64 \
            :runtime-external-consumer:compileKotlinIosSimulatorArm64 \
            :runtime-external-consumer:compileKotlinIosX64 \
            :dataloom-runtime:checkKotlinAbi \
            --no-configuration-cache \
            --stacktrace \
            --console=plain

      - name: Commit correction and remove temporary workflow
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dl-040-apple-directory-fsync-fix.yml
          git add \
            dataloom-runtime/src/iosMain/kotlin/io/dataloom/runtime/retry/AppleFileCircuitBreakerStateStore.kt \
            docs/apple/circuit-state-store.md \
            docs/audits/DL-040-apple-file-circuit-store-checkpoint.md
          git diff --check
          git commit -m "DL-040: fsync Apple circuit state directory entries"
          git push origin "HEAD:${HEAD_BRANCH}"
