name: Temporary Provider Protection Runtime Evidence

on:
  push:
    branches:
      - codex/dl-retry-033-provider-protection-runtime

permissions:
  contents: write

concurrency:
  group: temporary-provider-protection-runtime
  cancel-in-progress: true

jobs:
  validate-and-commit:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout review branch
        uses: actions/checkout@v6
        with:
          ref: codex/dl-retry-033-provider-protection-runtime
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Index provider protection runtime documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/api/README.md")
          text = path.read_text()
          row = "| [Provider circuit protection runtime](./provider-circuit-protection-runtime.md) | Partial V1 subsystem | Immutable scope-bound storage/transport assembly with timeout-before-circuit composition. |"
          if row not in text:
              anchor = "| [Storage and transport circuit adapters](./storage-transport-circuit-adapters.md) | Partial V1 subsystem | Exact provider-operation scopes, timeout-aware circuit classification, and uncollapsed execution/recording evidence. |"
              if anchor not in text:
                  raise SystemExit("Provider circuit adapter index anchor not found")
              text = text.replace(anchor, anchor + "\n" + row, 1)
          path.write_text(text)
          PY

      - name: Compile and test provider protection runtime
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :dataloom-runtime:jvmTest \
            :dataloom-runtime:iosSimulatorArm64Test \
            :runtime-external-consumer:compileKotlinJvm \
            :runtime-external-consumer:compileKotlinIosArm64 \
            :runtime-external-consumer:compileKotlinIosSimulatorArm64 \
            :runtime-external-consumer:compileKotlinIosX64 \
            --configuration-cache \
            --stacktrace \
            --warning-mode all \
            --console=plain

      - name: Generate exact public ABI baselines
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :dataloom-runtime:updateKotlinAbi \
            :dataloom-apple:updateKotlinAbi \
            --no-configuration-cache \
            --stacktrace \
            --console=plain

      - name: Validate ABI consumers and Apple framework
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :dataloom-runtime:checkKotlinAbi \
            :dataloom-runtime:checkPublicAbiBoundaries \
            :dataloom-apple:checkKotlinAbi \
            :runtime-external-consumer:checkRuntimeExternalConsumer \
            :dataloom-apple:assembleDataLoomReleaseXCFramework \
            --no-configuration-cache \
            --stacktrace \
            --warning-mode all \
            --console=plain

      - name: Verify generated runtime evidence
        shell: bash
        run: |
          set -euo pipefail
          grep -F "ProtectedStorageOperations" dataloom-runtime/api/dataloom-runtime.api
          grep -F "ProtectedTransportOperations" dataloom-runtime/api/dataloom-runtime.api
          grep -F "StorageCircuitProtectionRuntime" dataloom-runtime/api/dataloom-runtime.klib.api
          grep -F "TransportCircuitProtectionRuntime" dataloom-runtime/api/dataloom-runtime.klib.api
          grep -F "ProviderCircuitProtectionRuntimeExternalConsumerProbe" \
            runtime-external-consumer/src/commonMain/kotlin/io/dataloom/consumer/ProviderCircuitProtectionRuntimeExternalConsumerProbe.kt
          grep -F "provider-circuit-protection-runtime.md" docs/api/README.md
          test -d dataloom-apple/build/XCFrameworks/release/DataLoom.xcframework
          git diff --check

      - name: Commit generated evidence and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temporary-provider-protection-runtime-evidence.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No provider protection runtime evidence to commit."
            exit 1
          fi
          git commit -m "DL-040: qualify provider circuit protection runtime"
          git push origin HEAD:codex/dl-retry-033-provider-protection-runtime
