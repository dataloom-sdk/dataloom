name: Temporary Storage Transport Timeout Evidence

on:
  push:
    branches:
      - codex/dl-retry-031-storage-transport-timeouts

permissions:
  contents: write

concurrency:
  group: temporary-storage-transport-timeouts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-commit:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout review branch
        uses: actions/checkout@v6
        with:
          ref: codex/dl-retry-031-storage-transport-timeouts
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Apply documentation index
        run: python3 .github/scripts/temporary_storage_transport_timeout_docs.py

      - name: Compile and test provider timeout decorators
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :dataloom-runtime:jvmTest \
            :dataloom-runtime:iosSimulatorArm64Test \
            :runtime-external-consumer:compileKotlinJvm \
            :runtime-external-consumer:compileKotlinIosArm64 \
            :runtime-external-consumer:compileKotlinIosSimulatorArm64 \
            :runtime-external-consumer:compileKotlinIosX64 \
            --configuration-cache \
            --stacktrace \
            --warning-mode all \
            --console=plain

      - name: Generate exact public ABI baselines
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :dataloom-runtime:updateKotlinAbi \
            :dataloom-apple:updateKotlinAbi \
            --no-configuration-cache \
            --stacktrace \
            --console=plain

      - name: Validate ABI consumers and Apple framework
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :dataloom-runtime:checkKotlinAbi \
            :dataloom-runtime:checkPublicAbiBoundaries \
            :dataloom-apple:checkKotlinAbi \
            :runtime-external-consumer:checkRuntimeExternalConsumer \
            :dataloom-apple:assembleDataLoomReleaseXCFramework \
            --no-configuration-cache \
            --stacktrace \
            --warning-mode all \
            --console=plain

      - name: Verify generated provider timeout evidence
        shell: bash
        run: |
          set -euo pipefail
          grep -F "TimeoutEnforcingStorageProvider" dataloom-runtime/api/dataloom-runtime.api
          grep -F "TimeoutEnforcingTransportProvider" dataloom-runtime/api/dataloom-runtime.api
          grep -F "StorageProviderTimeoutRuntime" dataloom-runtime/api/dataloom-runtime.klib.api
          grep -F "TransportProviderTimeoutRuntime" dataloom-runtime/api/dataloom-runtime.klib.api
          grep -F "StorageTransportProviderTimeoutExternalConsumerProbe" \
            runtime-external-consumer/src/commonMain/kotlin/io/dataloom/consumer/StorageTransportProviderTimeoutExternalConsumerProbe.kt
          grep -F "Storage and transport provider timeouts" \
            docs/api/storage-transport-provider-timeouts.md
          grep -F "storage-transport-provider-timeouts.md" docs/api/README.md
          test -d dataloom-apple/build/XCFrameworks/release/DataLoom.xcframework
          git diff --check

      - name: Commit generated evidence and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/temporary-storage-transport-timeout-evidence.yml \
            .github/scripts/temporary_storage_transport_timeout_docs.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No provider timeout evidence to commit."
            exit 1
          fi
          git commit -m "DL-040: qualify storage and transport provider timeouts"
          git push origin HEAD:codex/dl-retry-031-storage-transport-timeouts
