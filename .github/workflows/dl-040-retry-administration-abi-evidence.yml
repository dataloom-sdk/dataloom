name: DL-040 Retry Administration ABI Evidence

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-reviewed-abi:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/dl-retry-042-manual-retry-administration'
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Isolate retry administration internal outcome types
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "dataloom-runtime/src/commonMain/kotlin/io/dataloom/runtime/retry/"
              "RetryAdministrationCoordinator.kt"
          )
          source = path.read_text()
          replacements = {
              "LoadOutcome": "RetryAdministrationLoadOutcome",
              "AdmissionOutcome": "RetryAdministrationAdmissionOutcome",
              "UpdateOutcome": "RetryAdministrationUpdateOutcome",
          }
          for old, new in replacements.items():
              source = source.replace(old, new)
          path.write_text(source)
          PY

      - name: Generate exact JVM and Kotlin Native ABI declarations
        run: |
          chmod +x gradlew
          ./gradlew \
            :dataloom-api:updateKotlinAbi \
            :dataloom-runtime:updateKotlinAbi \
            --no-configuration-cache \
            --stacktrace \
            --console=plain

      - name: Commit source fix, ABI evidence, and remove temporary workflow
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/dl-040-retry-administration-abi-evidence.yml
          git add \
            dataloom-api/api/dataloom-api.api \
            dataloom-api/api/dataloom-api.klib.api \
            dataloom-runtime/src/commonMain/kotlin/io/dataloom/runtime/retry/RetryAdministrationCoordinator.kt \
            dataloom-runtime/api/dataloom-runtime.api \
            dataloom-runtime/api/dataloom-runtime.klib.api
          git commit -m "DL-040: generate retry administration ABI evidence"
          git push origin "HEAD:${HEAD_BRANCH}"
