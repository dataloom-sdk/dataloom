name: DL-040 Retry Administration ABI Evidence

on:
  push:
    branches:
      - codex/dl-retry-042-abi-evidence
    paths:
      - .github/workflows/dl-040-retry-administration-abi-evidence.yml

permissions:
  contents: write

jobs:
  generate-reviewed-abi:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v6
        with:
          ref: codex/dl-retry-042-abi-evidence
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate exact JVM and Kotlin Native ABI declarations
        run: |
          chmod +x gradlew
          ./gradlew \
            :dataloom-api:updateKotlinAbi \
            :dataloom-runtime:updateKotlinAbi \
            --no-configuration-cache \
            --stacktrace \
            --console=plain

      - name: Commit generated ABI declarations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            dataloom-api/api/dataloom-api.api \
            dataloom-api/api/dataloom-api.klib.api \
            dataloom-runtime/api/dataloom-runtime.api \
            dataloom-runtime/api/dataloom-runtime.klib.api
          if git diff --cached --quiet; then
            echo "No ABI changes were generated."
            exit 1
          fi
          git commit -m "DL-040: generate retry administration ABI evidence"
          git push origin HEAD:codex/dl-retry-042-abi-evidence
