name: One-time inline refresh test reconciliation

on:
  push:
    branches:
      - agent/dl-strategy-016-inline-cache-refresh-runtime

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Reconcile pre-feature cache refresh assertion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("dataloom-runtime/src/commonTest/kotlin/io/dataloom/runtime/strategy/CacheFirstServingExecutionTest.kt")
          text = path.read_text()
          import_anchor = "import io.dataloom.api.strategy.StrategyProfileId\n"
          if "import io.dataloom.api.strategy.StrategyProviderCapability\n" not in text:
              text = text.replace(
                  import_anchor,
                  import_anchor + "import io.dataloom.api.strategy.StrategyProviderCapability\n",
              )

          old = '''    @Test
              fun refreshPlanIsRejectedBeforeProviderInvocation() = runTest {
                  val storage = RecordingCacheStorage(
                      success(StrategyCacheAccessResult.Available(freshEvidence())),
                  )
                  val fixture = fixture(storage)

                  val result = fixture.coordinator.execute(
                      request = request(
                          cacheState = StrategyCacheState.FRESH,
                          refreshOnFreshHit = true,
                          requireDurableRefresh = false,
                      ),
                      bindings = fixture.bindings,
                  )

                  val rejected = assertIs<StrategySynchronizationExecutionResult.Rejected>(result)
                  assertEquals(StrategyExecutionRejectionReason.UNSUPPORTED_PLAN, rejected.reason)
                  assertEquals(0, storage.cacheAccessCalls)
                  assertEquals(0, storage.storageOperationCalls)
              }
          '''
          new = '''    @Test
              fun refreshPlanWithoutTransportFailsBeforeCacheInvocation() = runTest {
                  val storage = RecordingCacheStorage(
                      success(StrategyCacheAccessResult.Available(freshEvidence())),
                  )
                  val fixture = fixture(storage)

                  val result = fixture.coordinator.execute(
                      request = request(
                          cacheState = StrategyCacheState.FRESH,
                          refreshOnFreshHit = true,
                          requireDurableRefresh = false,
                      ),
                      bindings = fixture.bindings,
                  )

                  val rejected = assertIs<StrategySynchronizationExecutionResult.Rejected>(result)
                  assertEquals(
                      StrategyExecutionRejectionReason.PROVIDER_RESOLUTION_FAILED,
                      rejected.reason,
                  )
                  assertEquals(
                      setOf(StrategyProviderCapability.TRANSPORT),
                      rejected.missingCapabilities,
                  )
                  assertEquals(0, storage.cacheAccessCalls)
                  assertEquals(0, storage.storageOperationCalls)
              }
          '''
          if old not in text:
              raise SystemExit("Expected pre-feature refresh assertion was not found exactly.")
          path.write_text(text.replace(old, new))
          PY
          git diff --check

      - name: Commit reconciled test
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dataloom-runtime/src/commonTest/kotlin/io/dataloom/runtime/strategy/CacheFirstServingExecutionTest.kt
          git commit -m "DL-039B: reconcile cache refresh serving test"
          git push origin "HEAD:${GITHUB_REF_NAME}"
