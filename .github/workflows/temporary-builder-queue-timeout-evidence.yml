# Validated workflow definition; this comment intentionally retriggers branch validation.
name: Temporary Builder Queue Timeout Evidence

on:
  push:
    branches:
      - codex/dl-retry-023-builder-queue-provider-timeouts

permissions:
  contents: write

concurrency:
  group: temporary-builder-queue-timeout-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-commit:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout review branch
        uses: actions/checkout@v6
        with:
          ref: codex/dl-retry-023-builder-queue-provider-timeouts
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Patch builder integration, tests, and documentation
        run: python3 .github/scripts/temporary_builder_queue_timeout_patch.py

      - name: Compile and test builder queue-provider timeout assembly
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :dataloom-runtime:jvmTest \
            :dataloom-runtime:iosSimulatorArm64Test \
            :runtime-external-consumer:compileKotlinJvm \
            :runtime-external-consumer:compileKotlinIosArm64 \
            :runtime-external-consumer:compileKotlinIosSimulatorArm64 \
            :runtime-external-consumer:compileKotlinIosX64 \
            --configuration-cache \
            --stacktrace \
            --warning-mode all \
            --console=plain

      - name: Generate exact public ABI baselines
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :dataloom-runtime:updateKotlinAbi \
            :dataloom-apple:updateKotlinAbi \
            --no-configuration-cache \
            --stacktrace \
            --console=plain

      - name: Validate ABI and Apple framework
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :dataloom-runtime:checkKotlinAbi \
            :dataloom-runtime:checkPublicAbiBoundaries \
            :dataloom-apple:checkKotlinAbi \
            :runtime-external-consumer:checkRuntimeExternalConsumer \
            :dataloom-apple:assembleDataLoomReleaseXCFramework \
            --no-configuration-cache \
            --stacktrace \
            --warning-mode all \
            --console=plain

      - name: Verify generated builder queue timeout evidence
        shell: bash
        run: |
          set -euo pipefail
          grep -F "getQueueProviderTimeout" dataloom-runtime/api/dataloom-runtime.api
          grep -F "queueProviderTimeout" dataloom-runtime/api/dataloom-runtime.klib.api
          grep -F "QueueWorkerProviderTimeoutRuntime.create" \
            dataloom-runtime/src/commonMain/kotlin/io/dataloom/runtime/facade/DataLoomBuilder.kt
          grep -F "DataLoomBuilder automatic assembly" docs/api/queue-provider-timeouts.md
          test -d dataloom-apple/build/XCFrameworks/release/DataLoom.xcframework
          git diff --check

      - name: Commit generated evidence and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/temporary-builder-queue-timeout-evidence.yml \
            .github/scripts/temporary_builder_queue_timeout_patch.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No builder queue timeout evidence to commit."
            exit 1
          fi
          git commit -m "DL-040: qualify builder queue-provider timeouts"
          git push origin HEAD:codex/dl-retry-023-builder-queue-provider-timeouts
