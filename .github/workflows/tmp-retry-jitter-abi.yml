name: Temporary Retry Jitter ABI

on:
  push:
    branches:
      - codex/dl-retry-011-deterministic-jitter

permissions:
  contents: read

concurrency:
  group: temporary-retry-jitter-abi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-runtime-abi:
    name: Generate runtime JVM and KLib ABI
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Generate ABI and validate focused retry surface
        run: >-
          ./gradlew
          :dataloom-runtime:updateKotlinAbi
          :dataloom-runtime:jvmTest
          :runtime-external-consumer:compileKotlinJvm
          :runtime-external-consumer:compileKotlinIosArm64
          :runtime-external-consumer:compileKotlinIosSimulatorArm64
          :runtime-external-consumer:compileKotlinIosX64
          --configuration-cache
          --stacktrace
          --console=plain

      - name: Upload generated runtime ABI
        uses: actions/upload-artifact@v6
        with:
          name: retry-jitter-runtime-abi
          path: dataloom-runtime/api
          if-no-files-found: error
          retention-days: 1
