name: Temporary Retry Jitter ABI

on:
  push:
    branches:
      - codex/dl-retry-011-deterministic-jitter
    paths:
      - .github/workflows/tmp-retry-jitter-abi.yml
      - dataloom-runtime/src/commonMain/kotlin/io/dataloom/runtime/retry/**
      - dataloom-runtime/src/commonTest/kotlin/io/dataloom/runtime/retry/**
      - runtime-external-consumer/src/commonMain/kotlin/io/dataloom/consumer/RuntimeExternalConsumerProbe.kt

permissions:
  contents: write

concurrency:
  group: temporary-retry-jitter-abi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-runtime-abi:
    name: Generate and commit runtime JVM and KLib ABI
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Generate ABI and validate focused retry surface
        run: >-
          ./gradlew
          :dataloom-runtime:updateKotlinAbi
          :dataloom-runtime:jvmTest
          :runtime-external-consumer:compileKotlinJvm
          :runtime-external-consumer:compileKotlinIosArm64
          :runtime-external-consumer:compileKotlinIosSimulatorArm64
          :runtime-external-consumer:compileKotlinIosX64
          --configuration-cache
          --stacktrace
          --console=plain

      - name: Commit exact generated ABI baselines
        shell: bash
        run: |
          set -euo pipefail
          git add dataloom-runtime/api
          if git diff --cached --quiet; then
            echo "ERROR: Expected retry jitter API/ABI changes were not generated."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "DL-040: update retry jitter ABI baselines"
          git push origin "HEAD:${GITHUB_REF_NAME}"
