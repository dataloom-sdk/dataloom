name: Temporary Retry Jitter ABI

on:
  push:
    branches:
      - codex/dl-retry-011-deterministic-jitter
    paths:
      - .github/workflows/tmp-retry-jitter-abi.yml
      - dataloom-runtime/src/commonMain/kotlin/io/dataloom/runtime/retry/**
      - dataloom-runtime/src/commonTest/kotlin/io/dataloom/runtime/retry/**
      - runtime-external-consumer/src/commonMain/kotlin/io/dataloom/consumer/RuntimeExternalConsumerProbe.kt

permissions:
  contents: write

concurrency:
  group: temporary-retry-jitter-abi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-runtime-abi:
    name: Generate and commit runtime JVM and KLib ABI
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Generate, validate, and publish exact ABI evidence
        shell: bash
        run: |
          set -uo pipefail
          log_file="$(mktemp)"
          status_file=".github/retry-jitter-abi-status.txt"

          set +e
          ./gradlew \
            :dataloom-runtime:updateKotlinAbi \
            :dataloom-runtime:jvmTest \
            :runtime-external-consumer:compileKotlinJvm \
            :runtime-external-consumer:compileKotlinIosArm64 \
            :runtime-external-consumer:compileKotlinIosSimulatorArm64 \
            :runtime-external-consumer:compileKotlinIosX64 \
            --configuration-cache \
            --stacktrace \
            --console=plain 2>&1 | tee "$log_file"
          gradle_status=${PIPESTATUS[0]}
          set -e

          {
            echo "commit=${GITHUB_SHA}"
            echo "gradle_status=${gradle_status}"
            echo "generated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "--- final Gradle output ---"
            tail -n 160 "$log_file"
          } > "$status_file"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$status_file"
          if [[ "$gradle_status" -eq 0 ]]; then
            git add dataloom-runtime/api
          fi
          git rm .github/workflows/tmp-retry-jitter-abi.yml
          git commit -m "DL-040: record retry jitter ABI validation"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          exit "$gradle_status"
