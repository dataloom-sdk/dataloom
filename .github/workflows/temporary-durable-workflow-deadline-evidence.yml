name: Temporary Durable Workflow Deadline Evidence

on:
  push:
    branches:
      - codex/dl-retry-036-durable-workflow-deadline
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: temporary-durable-workflow-deadline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-commit:
    runs-on: macos-15
    timeout-minutes: 55
    env:
      DATALOOM_ANDROID_BUILD: "true"

    steps:
      - name: Checkout review branch
        uses: actions/checkout@v6
        with:
          ref: codex/dl-retry-036-durable-workflow-deadline
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Apply durable workflow deadline patch
        run: python3 .github/scripts/temporary_durable_workflow_deadline_patch.py

      - name: Index durable workflow timeout documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/api/README.md")
          text = path.read_text()
          row = "| [Durable workflow timeout evidence](./durable-workflow-timeouts.md) | Partial V1 subsystem | Immutable absolute workflow deadlines preserved through queue persistence, retry, deferral, recovery, and restart. |"
          if row not in text:
              anchor = "| [Retry timeout boundaries](./retry-timeouts.md) | Partial V1 subsystem | Independent timeout contracts, workflow-deadline precedence, coroutine executor, and selected provider/runtime assembly. |"
              if anchor not in text:
                  raise SystemExit("Retry timeout documentation anchor not found")
              text = text.replace(anchor, anchor + "\n" + row, 1)
          path.write_text(text)
          PY

      - name: Compile and test durable workflow deadline behavior
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :dataloom-api:jvmTest \
            :dataloom-runtime:jvmTest \
            :dataloom-testing:jvmTest \
            :dataloom-queue-room:testDebugUnitTest \
            :dataloom-runtime:iosSimulatorArm64Test \
            :runtime-external-consumer:compileKotlinJvm \
            :runtime-external-consumer:compileKotlinIosArm64 \
            :runtime-external-consumer:compileKotlinIosSimulatorArm64 \
            :runtime-external-consumer:compileKotlinIosX64 \
            --configuration-cache \
            --stacktrace \
            --warning-mode all \
            --console=plain

      - name: Generate Room schema version 4
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :dataloom-queue-room:kspDebugKotlin \
            --no-configuration-cache \
            --stacktrace \
            --console=plain \
            --max-workers=1

      - name: Generate exact public ABI baselines
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :dataloom-api:updateKotlinAbi \
            :dataloom-runtime:updateKotlinAbi \
            :dataloom-testing:updateKotlinAbi \
            :dataloom-apple:updateKotlinAbi \
            --no-configuration-cache \
            --stacktrace \
            --console=plain

      - name: Validate ABI consumers and Apple framework
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :dataloom-api:checkKotlinAbi \
            :dataloom-runtime:checkKotlinAbi \
            :dataloom-testing:checkKotlinAbi \
            :dataloom-runtime:checkPublicAbiBoundaries \
            :dataloom-apple:checkKotlinAbi \
            :runtime-external-consumer:checkRuntimeExternalConsumer \
            :dataloom-apple:assembleDataLoomReleaseXCFramework \
            --no-configuration-cache \
            --stacktrace \
            --warning-mode all \
            --console=plain

      - name: Verify generated workflow deadline evidence
        shell: bash
        run: |
          set -euo pipefail
          grep -F "WorkflowTimeoutState" dataloom-api/api/dataloom-api.api
          grep -F "WorkflowTimeoutState" dataloom-api/api/dataloom-api.klib.api
          grep -F "WorkflowTimeoutStateExecutor" dataloom-runtime/api/dataloom-runtime.api
          grep -F "getWorkflowTimeoutState" dataloom-runtime/api/dataloom-runtime.api
          grep -F "WorkflowTimeoutQueuePersistenceTest" \
            dataloom-testing/src/commonTest/kotlin/io/dataloom/testing/queue/WorkflowTimeoutQueuePersistenceTest.kt
          grep -F '"version": 4' \
            dataloom-queue-room/schemas/io.dataloom.queue.room.internal.DataLoomRoomDatabase/4.json
          grep -F 'workflow_started_at_ms' \
            dataloom-queue-room/schemas/io.dataloom.queue.room.internal.DataLoomRoomDatabase/4.json
          grep -F 'workflow_deadline_at_ms' \
            dataloom-queue-room/schemas/io.dataloom.queue.room.internal.DataLoomRoomDatabase/4.json
          grep -F "MIGRATION_3_4" \
            dataloom-queue-room/src/main/kotlin/io/dataloom/queue/room/DataLoomRoomMigrations.kt
          grep -F "durable-workflow-timeouts.md" docs/api/README.md
          test -d dataloom-apple/build/XCFrameworks/release/DataLoom.xcframework
          git diff --check

      - name: Commit generated evidence and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/temporary-durable-workflow-deadline-evidence.yml \
            .github/scripts/temporary_durable_workflow_deadline_patch.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No durable workflow deadline evidence to commit."
            exit 1
          fi
          git commit -m "DL-040: qualify durable workflow deadline persistence"
          git push origin HEAD:codex/dl-retry-036-durable-workflow-deadline
