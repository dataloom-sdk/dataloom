name: Temporary Transport Connection Timeout Evidence

on:
  push:
    branches:
      - codex/dl-retry-040-transport-connection-timeout

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/dl-retry-040-transport-connection-timeout
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - run: chmod +x gradlew
      - name: Compile connection-timeout runtime and consumers
        run: |
          ./gradlew \
            :dataloom-runtime:jvmTest \
            :dataloom-runtime:iosSimulatorArm64Test \
            :runtime-external-consumer:compileKotlinJvm \
            :runtime-external-consumer:compileKotlinIosArm64 \
            :runtime-external-consumer:compileKotlinIosSimulatorArm64 \
            :runtime-external-consumer:compileKotlinIosX64 \
            --configuration-cache --stacktrace --warning-mode all --console=plain
      - name: Generate exact ABI
        run: |
          ./gradlew :dataloom-runtime:updateKotlinAbi :dataloom-apple:updateKotlinAbi \
            --no-configuration-cache --stacktrace --console=plain
      - name: Validate ABI and Apple framework
        run: |
          ./gradlew \
            :dataloom-runtime:checkKotlinAbi \
            :dataloom-runtime:checkPublicAbiBoundaries \
            :dataloom-apple:checkKotlinAbi \
            :runtime-external-consumer:checkRuntimeExternalConsumer \
            :dataloom-apple:assembleDataLoomReleaseXCFramework \
            --no-configuration-cache --stacktrace --warning-mode all --console=plain
      - name: Commit generated evidence
        run: |
          rm -f .github/workflows/temporary-transport-connection-timeout-evidence.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 1; fi
          git commit -m "DL-040: qualify transport connection timeout"
          git push origin HEAD:codex/dl-retry-040-transport-connection-timeout
