name: DL-040 Apple Retry Administration Executor Evidence

on:
  push:
    branches: [codex/dl-retry-048-apple-retry-admin-executor]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dl-040-apple-retry-admin-executor-evidence
  cancel-in-progress: true

jobs:
  qualify-apple-retry-administration-executor:
    name: Qualify Apple retry administration executor
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout branch head
        uses: actions/checkout@v6
        with:
          ref: codex/dl-retry-048-apple-retry-admin-executor
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Qualify runtime, consumers, ABI, and XCFramework
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew \
            :dataloom-runtime:updateKotlinAbi \
            --configuration-cache \
            --stacktrace \
            --console=plain
          ./gradlew \
            :dataloom-runtime:jvmTest \
            :dataloom-runtime:iosSimulatorArm64Test \
            :runtime-external-consumer:compileKotlinJvm \
            :runtime-external-consumer:compileKotlinIosArm64 \
            :runtime-external-consumer:compileKotlinIosSimulatorArm64 \
            :runtime-external-consumer:compileKotlinIosX64 \
            :dataloom-runtime:checkKotlinAbi \
            :dataloom-runtime:checkPublicAbiBoundaries \
            :dataloom-apple:checkKotlinAbi \
            :dataloom-apple:assembleDataLoomReleaseXCFramework \
            --configuration-cache \
            --stacktrace \
            --console=plain
          git diff --check

      - name: Commit exact ABI evidence and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dataloom-runtime/api
          git rm .github/workflows/dl-040-apple-retry-admin-executor-evidence.yml
          git diff --cached --check
          git commit -m "DL-040: record Apple retry executor ABI evidence"
          git push origin HEAD:codex/dl-retry-048-apple-retry-admin-executor
