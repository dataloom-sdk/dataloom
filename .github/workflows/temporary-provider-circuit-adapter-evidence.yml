name: Temporary Provider Circuit Adapter Evidence

on:
  push:
    branches:
      - codex/dl-retry-031-storage-transport-circuit-adapters

permissions:
  contents: write

concurrency:
  group: temporary-provider-circuit-adapters
  cancel-in-progress: true

jobs:
  validate-and-commit:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout review branch
        uses: actions/checkout@v6
        with:
          ref: codex/dl-retry-031-storage-transport-circuit-adapters
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Index provider circuit documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/api/README.md")
          text = path.read_text()

          row = "| [Storage and transport circuit adapters](./storage-transport-circuit-adapters.md) | Partial V1 subsystem | Exact provider-operation scopes, timeout-aware circuit classification, and uncollapsed execution/recording evidence. |"
          if row not in text:
              anchor = "| [Circuit execution gate](./circuit-execution-gate.md) | Partial V1 subsystem | Pre-execution permission, once-only invocation, classified provider failures, post-execution evidence, retry scheduling, and queue-operation adaptation. |"
              if anchor not in text:
                  raise SystemExit("Circuit execution gate index anchor not found")
              text = text.replace(anchor, anchor + "\n" + row, 1)

          text = text.replace(
              "V1 retry work still requires complete transport/storage circuit assembly,\nprotocol-specific timeout\nenforcement,",
              "V1 retry work still requires direct transport/storage pipeline and builder assembly,\nprotocol-specific timeout enforcement,",
          )
          path.write_text(text)
          PY

      - name: Compile and test provider circuit adapters
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :dataloom-runtime:jvmTest \
            :dataloom-runtime:iosSimulatorArm64Test \
            :runtime-external-consumer:compileKotlinJvm \
            :runtime-external-consumer:compileKotlinIosArm64 \
            :runtime-external-consumer:compileKotlinIosSimulatorArm64 \
            :runtime-external-consumer:compileKotlinIosX64 \
            --configuration-cache \
            --stacktrace \
            --warning-mode all \
            --console=plain

      - name: Generate exact public ABI baselines
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :dataloom-runtime:updateKotlinAbi \
            :dataloom-apple:updateKotlinAbi \
            --no-configuration-cache \
            --stacktrace \
            --console=plain

      - name: Validate ABI consumers and Apple framework
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :dataloom-runtime:checkKotlinAbi \
            :dataloom-runtime:checkPublicAbiBoundaries \
            :dataloom-apple:checkKotlinAbi \
            :runtime-external-consumer:checkRuntimeExternalConsumer \
            :dataloom-apple:assembleDataLoomReleaseXCFramework \
            --no-configuration-cache \
            --stacktrace \
            --warning-mode all \
            --console=plain

      - name: Verify generated provider circuit evidence
        shell: bash
        run: |
          set -euo pipefail
          grep -F "CircuitBreakerStorageOperationAdapter" dataloom-runtime/api/dataloom-runtime.api
          grep -F "CircuitBreakerTransportOperationAdapter" dataloom-runtime/api/dataloom-runtime.api
          grep -F "StorageCircuitOperation" dataloom-runtime/api/dataloom-runtime.klib.api
          grep -F "TransportCircuitOperation" dataloom-runtime/api/dataloom-runtime.klib.api
          grep -F "StorageTransportCircuitExternalConsumerProbe" \
            runtime-external-consumer/src/commonMain/kotlin/io/dataloom/consumer/StorageTransportCircuitExternalConsumerProbe.kt
          grep -F "storage-transport-circuit-adapters.md" docs/api/README.md
          grep -F "Transport pull remains fail-closed" \
            docs/audits/DL-040-storage-transport-circuit-adapter-checkpoint.md
          test -d dataloom-apple/build/XCFrameworks/release/DataLoom.xcframework
          git diff --check

      - name: Commit generated evidence and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temporary-provider-circuit-adapter-evidence.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No provider circuit evidence to commit."
            exit 1
          fi
          git commit -m "DL-040: qualify storage and transport circuit adapters"
          git push origin HEAD:codex/dl-retry-031-storage-transport-circuit-adapters
