name: Temporary Retry Hint Evidence

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: temporary-retry-hint-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-commit:
    name: Validate retry hints, generate ABI, and commit evidence
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout review branch
        uses: actions/checkout@v6
        with:
          ref: codex/dl-retry-013-bounded-hints
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Apply documentation updates
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_retry_hint_docs.py
          git diff --check

      - name: Generate ABI and run focused cross-platform validation
        shell: bash
        run: |
          set -o pipefail
          mkdir -p retry-hint-evidence
          ./gradlew \
            :build-logic:test \
            :dataloom-model:updateKotlinAbi \
            :dataloom-api:updateKotlinAbi \
            :dataloom-runtime:updateKotlinAbi \
            :dataloom-testing:updateKotlinAbi \
            :dataloom-apple:updateKotlinAbi \
            :dataloom-model:jvmTest \
            :dataloom-api:jvmTest \
            :dataloom-runtime:jvmTest \
            :dataloom-testing:jvmTest \
            :runtime-external-consumer:compileKotlinJvm \
            :runtime-external-consumer:compileKotlinIosArm64 \
            :runtime-external-consumer:compileKotlinIosSimulatorArm64 \
            :runtime-external-consumer:compileKotlinIosX64 \
            :dataloom-apple:assembleDataLoomReleaseXCFramework \
            build \
            --configuration-cache \
            --stacktrace \
            --warning-mode all \
            --console=plain 2>&1 | tee retry-hint-evidence/gradle.log

      - name: Verify public hint ABI evidence
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'RetryDelayHint' dataloom-model/api/dataloom-model.api
          grep -q 'RetryDelayHintCarrier' dataloom-model/api/dataloom-model.api
          grep -q 'RetryHintConfiguration' dataloom-runtime/api/dataloom-runtime.api
          grep -q 'getRetryDelayHint' dataloom-api/api/dataloom-api.api
          grep -q 'RetryDelayHint' dataloom-model/api/dataloom-model.klib.api
          grep -q 'RetryHintConfiguration' dataloom-runtime/api/dataloom-runtime.klib.api

      - name: Remove temporary workflow and helper
        shell: bash
        run: |
          rm .github/workflows/temporary-retry-hint-evidence.yml
          rm .github/scripts/apply_retry_hint_docs.py
          git diff --check

      - name: Commit generated evidence and integrated documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'DL-040: integrate bounded retry hints and evidence'
          git push origin HEAD:codex/dl-retry-013-bounded-hints

      - name: Upload focused validation log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: retry-hint-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: retry-hint-evidence
          if-no-files-found: warn
          retention-days: 2
