name: Temporary Circuit Queue Worker Scheduler Evidence

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: temporary-circuit-queue-worker-scheduler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-and-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout review branch
        uses: actions/checkout@v6
        with:
          ref: codex/dl-retry-030-circuit-queue-worker-scheduler
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Compile and test queue worker scheduler circuit
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :dataloom-runtime:jvmTest \
            :dataloom-runtime:iosSimulatorArm64Test \
            :runtime-external-consumer:compileKotlinJvm \
            :runtime-external-consumer:compileKotlinIosArm64 \
            :runtime-external-consumer:compileKotlinIosSimulatorArm64 \
            :runtime-external-consumer:compileKotlinIosX64 \
            --configuration-cache \
            --stacktrace \
            --warning-mode all \
            --console=plain

      - name: Generate exact public ABI baselines
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :dataloom-runtime:updateKotlinAbi \
            :dataloom-apple:updateKotlinAbi \
            --no-configuration-cache \
            --stacktrace \
            --console=plain

      - name: Validate ABI consumers and Apple framework
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :dataloom-runtime:checkKotlinAbi \
            :dataloom-runtime:checkPublicAbiBoundaries \
            :dataloom-apple:checkKotlinAbi \
            :runtime-external-consumer:checkRuntimeExternalConsumer \
            :dataloom-apple:assembleDataLoomReleaseXCFramework \
            --no-configuration-cache \
            --stacktrace \
            --warning-mode all \
            --console=plain

      - name: Verify generated scheduler circuit evidence
        shell: bash
        run: |
          set -euo pipefail
          grep -F "SchedulerCircuitOperation" dataloom-runtime/api/dataloom-runtime.api
          grep -F "DataLoomCircuitQueueWorkerSchedulerSpec" \
            dataloom-runtime/api/dataloom-runtime.klib.api
          grep -F "CircuitProtected" dataloom-runtime/api/dataloom-runtime.api
          grep -F "circuitQueueWorkerSchedulerConfiguration" \
            dataloom-runtime/api/dataloom-runtime.klib.api
          if grep -F "CircuitBreakerQueueWorkerSchedulerCircuit" \
            dataloom-runtime/api/dataloom-runtime.api \
            dataloom-runtime/api/dataloom-runtime.klib.api; then
            echo "Unused scheduler circuit holder leaked into public ABI."
            exit 1
          fi
          grep -F "BuilderCircuitQueueWorkerSchedulerExternalConsumerProbe" \
            runtime-external-consumer/src/commonMain/kotlin/io/dataloom/consumer/BuilderCircuitQueueWorkerSchedulerExternalConsumerProbe.kt
          grep -F "Circuit-protected queue-worker scheduling" \
            docs/api/circuit-queue-worker-scheduler.md
          test -d dataloom-apple/build/XCFrameworks/release/DataLoom.xcframework
          git diff --check

      - name: Commit generated evidence and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/temporary-circuit-queue-worker-scheduler-evidence.yml \
            .github/scripts/temporary_circuit_queue_worker_scheduler_patch.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No scheduler circuit evidence to commit."
            exit 1
          fi
          git commit -m "DL-040: qualify queue worker scheduler circuit"
          git push origin HEAD:codex/dl-retry-030-circuit-queue-worker-scheduler
