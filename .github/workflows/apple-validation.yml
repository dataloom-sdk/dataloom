name: Apple Platform Validation

# Validates Apple-platform compilation, iOS simulator tests, XCFramework
# assembly, and Swift interoperability for the DataLoom SDK (DL-036).
#
# This job runs on macOS because Kotlin/Native linking for Apple targets,
# iOS simulator test execution, XCFramework assembly, and xcodebuild all
# require the Apple SDK and Xcode, which are only available on macOS.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple-validate:
    name: Validate Apple targets, XCFramework, and Swift smoke test
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Verify Gradle version
        run: ./gradlew --version

      - name: Verify project structure (includes dataloom-apple on macOS)
        run: ./gradlew projects

      # ---------------------------------------------------------------
      # Apple target compilation
      # ---------------------------------------------------------------
      - name: Compile dataloom-api for iosArm64
        run: ./gradlew :dataloom-api:compileKotlinIosArm64

      - name: Compile dataloom-api for iosSimulatorArm64
        run: ./gradlew :dataloom-api:compileKotlinIosSimulatorArm64

      - name: Compile dataloom-api for iosX64
        run: ./gradlew :dataloom-api:compileKotlinIosX64

      - name: Compile dataloom-core for iosArm64
        run: ./gradlew :dataloom-core:compileKotlinIosArm64

      - name: Compile dataloom-core for iosSimulatorArm64
        run: ./gradlew :dataloom-core:compileKotlinIosSimulatorArm64

      - name: Compile dataloom-core for iosX64
        run: ./gradlew :dataloom-core:compileKotlinIosX64

      - name: Compile dataloom-runtime for iosArm64
        run: ./gradlew :dataloom-runtime:compileKotlinIosArm64

      - name: Compile dataloom-runtime for iosSimulatorArm64
        run: ./gradlew :dataloom-runtime:compileKotlinIosSimulatorArm64

      - name: Compile dataloom-runtime for iosX64
        run: ./gradlew :dataloom-runtime:compileKotlinIosX64

      - name: Compile dataloom-testing for iosArm64
        run: ./gradlew :dataloom-testing:compileKotlinIosArm64

      - name: Compile dataloom-testing for iosSimulatorArm64
        run: ./gradlew :dataloom-testing:compileKotlinIosSimulatorArm64

      - name: Compile dataloom-testing for iosX64
        run: ./gradlew :dataloom-testing:compileKotlinIosX64

      # ---------------------------------------------------------------
      # iOS simulator tests
      # ---------------------------------------------------------------
      - name: Run shared tests on iosSimulatorArm64 (dataloom-api)
        run: ./gradlew :dataloom-api:iosSimulatorArm64Test

      - name: Run shared tests on iosSimulatorArm64 (dataloom-core)
        run: ./gradlew :dataloom-core:iosSimulatorArm64Test

      - name: Run shared tests on iosSimulatorArm64 (dataloom-runtime)
        run: ./gradlew :dataloom-runtime:iosSimulatorArm64Test

      - name: Run shared tests on iosSimulatorArm64 (dataloom-testing)
        run: ./gradlew :dataloom-testing:iosSimulatorArm64Test

      # ---------------------------------------------------------------
      # XCFramework assembly
      # ---------------------------------------------------------------
      - name: Assemble DataLoom release XCFramework
        run: ./gradlew :dataloom-apple:assembleDataLoomReleaseXCFramework

      - name: Verify XCFramework slices exist
        run: |
          XCFW="dataloom-apple/build/XCFrameworks/release/DataLoom.xcframework"
          echo "=== XCFramework path: $XCFW ==="
          ls -la "$XCFW"
          echo ""
          echo "=== Framework slices ==="
          ls -la "$XCFW/"
          echo ""
          # Physical device slice: iosArm64
          echo "=== Physical device slice (iosArm64) ==="
          ls "$XCFW/ios-arm64/DataLoom.framework/" || {
            echo "ERROR: Physical device slice not found at ios-arm64/DataLoom.framework/"
            exit 1
          }
          echo ""
          # Simulator slice: Kotlin/Native merges iosSimulatorArm64 and iosX64
          # into a single fat slice under ios-arm64_x86_64-simulator
          echo "=== Simulator slice (iosSimulatorArm64 + iosX64 merged) ==="
          SIMULATOR_SLICE="$XCFW/ios-arm64_x86_64-simulator/DataLoom.framework/"
          if [ -d "$SIMULATOR_SLICE" ]; then
            ls "$SIMULATOR_SLICE"
            echo "Simulator slice verified: ios-arm64_x86_64-simulator"
          else
            echo "Looking for alternative simulator slice paths..."
            find "$XCFW" -name "*.framework" -type d | grep -i sim || {
              echo "ERROR: No simulator slice found in XCFramework"
              exit 1
            }
          fi
          echo ""
          echo "=== Info.plist ==="
          cat "$XCFW/Info.plist"

      # ---------------------------------------------------------------
      # Swift smoke test
      # ---------------------------------------------------------------
      - name: Copy XCFramework into smoke-test location
        run: |
          mkdir -p apple-smoke/DataLoom.xcframework
          cp -R dataloom-apple/build/XCFrameworks/release/DataLoom.xcframework/ apple-smoke/DataLoom.xcframework/

      - name: Compile Swift smoke test against generated XCFramework
        run: |
          cd apple-smoke
          xcodebuild build \
            -scheme DataLoomSwiftSmoke \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            SKIP_INSTALL=YES

      # ---------------------------------------------------------------
      # Full JVM regression on macOS (ensures nothing is regressed)
      # ---------------------------------------------------------------
      - name: Build all modules (JVM + Apple)
        run: ./gradlew build --configuration-cache

      - name: Run all tests (JVM + Apple simulator)
        run: >-
          ./gradlew
          :dataloom-api:allTests
          :dataloom-core:allTests
          :dataloom-runtime:allTests
          :dataloom-testing:allTests

      - name: Inspect runtime dependencies (must not include dataloom-testing)
        run: ./gradlew :dataloom-runtime:dependencies --configuration jvmRuntimeClasspath
