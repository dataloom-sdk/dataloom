name: Apple Platform Validation

# Validates Apple-platform compilation, iOS simulator tests, XCFramework
# assembly, and Swift interoperability for the DataLoom SDK (DL-036).
#
# This job runs on macOS because Kotlin/Native linking for Apple targets,
# iOS simulator test execution, XCFramework assembly, and xcodebuild all
# require the Apple SDK and Xcode, which are only available on macOS.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple-validate:
    name: Validate Apple targets, XCFramework, and Swift smoke test
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Validate build, tests, ABI, and XCFramework
        run: >-
          ./gradlew
          :build-logic:test
          build
          :runtime-external-consumer:compileKotlinIosArm64
          :runtime-external-consumer:compileKotlinIosSimulatorArm64
          :runtime-external-consumer:compileKotlinIosX64
          :dataloom-apple:assembleDataLoomReleaseXCFramework
          --configuration-cache
          --stacktrace
          --console=plain

      - name: Verify XCFramework slices exist
        run: |
          XCFW="dataloom-apple/build/XCFrameworks/release/DataLoom.xcframework"
          echo "=== XCFramework path: $XCFW ==="
          ls -la "$XCFW"
          echo ""
          echo "=== Framework slices ==="
          ls -la "$XCFW/"
          echo ""
          # Physical device slice: iosArm64
          echo "=== Physical device slice (iosArm64) ==="
          ls "$XCFW/ios-arm64/DataLoom.framework/" || {
            echo "ERROR: Physical device slice not found at ios-arm64/DataLoom.framework/"
            exit 1
          }
          echo ""
          # Simulator slice: Kotlin/Native merges iosSimulatorArm64 and iosX64
          # into a single fat slice under ios-arm64_x86_64-simulator
          echo "=== Simulator slice (iosSimulatorArm64 + iosX64 merged) ==="
          SIMULATOR_SLICE="$XCFW/ios-arm64_x86_64-simulator/DataLoom.framework/"
          if [ -d "$SIMULATOR_SLICE" ]; then
            ls "$SIMULATOR_SLICE"
            echo "Simulator slice verified: ios-arm64_x86_64-simulator"
          else
            echo "Looking for alternative simulator slice paths..."
            find "$XCFW" -name "*.framework" -type d | grep -i sim || {
              echo "ERROR: No simulator slice found in XCFramework"
              exit 1
            }
          fi
          echo ""
          echo "=== Info.plist ==="
          cat "$XCFW/Info.plist"

      - name: Audit exported Apple headers
        shell: bash
        run: |
          set -euo pipefail
          XCFW="dataloom-apple/build/XCFrameworks/release/DataLoom.xcframework"
          headers=()
          while IFS= read -r header; do
            headers+=("$header")
          done < <(find "$XCFW" -type f -name "DataLoom.h" | sort)

          if [[ "${#headers[@]}" -lt 2 ]]; then
            echo "ERROR: Expected DataLoom headers for device and simulator slices."
            printf '%s\n' "${headers[@]}"
            exit 1
          fi

          forbidden='io_dataloom_core|dataloom_core|DataloomCore|io_dataloom_testing|dataloom_testing|DataloomTesting'
          if grep -nE "$forbidden" "${headers[@]}"; then
            echo "ERROR: Apple headers expose implementation-only core or testing symbols."
            exit 1
          fi

          reference="${headers[0]}"
          for header in "${headers[@]:1}"; do
            if ! cmp -s "$reference" "$header"; then
              echo "ERROR: Exported DataLoom headers differ between XCFramework slices."
              diff -u "$reference" "$header" || true
              exit 1
            fi
          done

          echo "Verified ${#headers[@]} matching DataLoom headers with no core/testing leaks."

      # ---------------------------------------------------------------
      # Swift smoke test
      # ---------------------------------------------------------------
      - name: Copy XCFramework into smoke-test location
        run: |
          mkdir -p apple-smoke/DataLoom.xcframework
          cp -R dataloom-apple/build/XCFrameworks/release/DataLoom.xcframework/ apple-smoke/DataLoom.xcframework/

      - name: Compile Swift smoke test against generated XCFramework
        run: |
          cd apple-smoke
          xcodebuild build \
            -scheme DataLoomSwiftSmoke \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            SKIP_INSTALL=YES

  # ---------------------------------------------------------------------
  # Apple Simulator process-termination/relaunch proof (#94)
  # ---------------------------------------------------------------------
  #
  # A separate job from apple-validate above so a failure here (this is new,
  # never-run-before infrastructure -- see docs/apple/process-termination-proof.md)
  # cannot fail the existing, already-proven XCFramework/Swift-smoke checks,
  # and vice versa.
  #
  # This job builds a real, launchable iOS Simulator app
  # (apple-process-termination-proof-app/) that performs one genuine
  # production circuit-breaker write via AppleFileCircuitBreakerStateStore on
  # launch, installs and launches it on a real Simulator device, kills it
  # with `xcrun simctl terminate` (a genuine OS-level process kill -- not an
  # in-process simulation), relaunches it, and confirms the persisted
  # circuit-breaker state file survived by reading it directly from the
  # Simulator's app-container filesystem, from outside the app process,
  # before the kill and after the relaunch.
  #
  # Everything in this job is new and has never run on real macOS CI before
  # this PR. See docs/apple/process-termination-proof.md for exactly what
  # could and could not be verified from a Windows development host prior to
  # this job's first real run, and for the specific format/label
  # uncertainties this script's polling steps were deliberately written to
  # tolerate (grep-based substring matches rather than exact-format
  # assertions) rather than assume.
  apple-process-termination-proof:
    name: Apple Simulator process-termination/relaunch proof (circuit breaker)
    runs-on: macos-15
    timeout-minutes: 30
    # A genuine, fully green end-to-end run of this exact job was observed
    # on run 34730220519 (2026-09-13), after the device-type-selection fix:
    # real distinct pids before/after a genuine `xcrun simctl terminate` +
    # relaunch (13881 -> 14307), persisted circuit-breaker state confirmed
    # byte-identical. Now a required check like every other job in this
    # workflow -- continue-on-error is no longer needed.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Assemble the process-termination-proof XCFramework
        run: >-
          ./gradlew
          :apple-process-termination-proof:assembleDataLoomProcessTerminationProofReleaseXCFramework
          --configuration-cache
          --stacktrace
          --console=plain

      - name: Copy XCFramework into the proof app's project directory
        run: |
          set -euo pipefail
          SRC="apple-process-termination-proof/build/XCFrameworks/release/DataLoomProcessTerminationProof.xcframework"
          DEST="apple-process-termination-proof-app/DataLoomProcessTerminationProof.xcframework"
          echo "=== Copying $SRC -> $DEST ==="
          ls -la "$SRC"
          rm -rf "$DEST"
          cp -R "$SRC" "$DEST"

      - name: Build the proof app for the iOS Simulator
        run: |
          set -euo pipefail
          cd apple-process-termination-proof-app
          xcodebuild build \
            -project ProcessTerminationProofApp.xcodeproj \
            -scheme ProcessTerminationProofApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create and boot a dedicated Simulator device
        id: boot_simulator
        run: |
          set -euo pipefail
          RUNTIMES_JSON=$(xcrun simctl list runtimes --json)
          RUNTIME_ID=$(echo "$RUNTIMES_JSON" \
            | jq -r '[.runtimes[] | select(.isAvailable and (.identifier | startswith("com.apple.CoreSimulator.SimRuntime.iOS")))] | sort_by(.version) | last | .identifier')
          if [ -z "$RUNTIME_ID" ] || [ "$RUNTIME_ID" = "null" ]; then
            echo "ERROR: no available iOS simulator runtime found." >&2
            xcrun simctl list runtimes
            exit 1
          fi
          echo "Selected runtime: $RUNTIME_ID"

          # Pick a device type from the *selected runtime's own*
          # supportedDeviceTypes list, not from the global device-type list
          # independently. A naive global pick (even sorted "last") can
          # select a device type the runtime doesn't actually support --
          # e.g. lexicographic sort puts "iPhone 6s Plus" after "iPhone 17
          # Pro Max" (since '6' > '1' as characters), and old device types
          # like the 6s Plus are dropped from newer iOS runtimes'
          # compatibility list entirely. Restricting the candidate pool to
          # this runtime's own supportedDeviceTypes guarantees whatever is
          # chosen is actually creatable against $RUNTIME_ID.
          DEVICETYPE_ID=$(echo "$RUNTIMES_JSON" \
            | jq -r --arg rid "$RUNTIME_ID" '
                [.runtimes[] | select(.identifier == $rid) | .supportedDeviceTypes[]
                  | select(.name | contains("iPhone"))]
                | last | .identifier')
          if [ -z "$DEVICETYPE_ID" ] || [ "$DEVICETYPE_ID" = "null" ]; then
            echo "ERROR: no iPhone simulator device type supported by runtime $RUNTIME_ID." >&2
            echo "$RUNTIMES_JSON" | jq --arg rid "$RUNTIME_ID" '.runtimes[] | select(.identifier == $rid)'
            exit 1
          fi
          echo "Selected device type: $DEVICETYPE_ID"

          DEVICE_ID=$(xcrun simctl create ProcessTerminationProofDevice "$DEVICETYPE_ID" "$RUNTIME_ID")
          echo "Created device: $DEVICE_ID"
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Install, launch, kill, relaunch, and verify persisted state
        env:
          DEVICE_ID: ${{ steps.boot_simulator.outputs.device_id }}
          BUNDLE_ID: io.dataloom.processterminationproof.app
        run: |
          set -euo pipefail
          APP_PATH="apple-process-termination-proof-app/build/Build/Products/Debug-iphonesimulator/ProcessTerminationProofApp.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: built app not found at $APP_PATH" >&2
            find apple-process-termination-proof-app/build/Build/Products -maxdepth 3 || true
            exit 1
          fi

          xcrun simctl install "$DEVICE_ID" "$APP_PATH"

          echo "=== First launch (pre-kill) ==="
          LAUNCH_1=$(xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID")
          echo "$LAUNCH_1"
          PID_1=$(echo "$LAUNCH_1" | sed -n 's/^.*: *\([0-9][0-9]*\)$/\1/p')
          if [ -z "$PID_1" ]; then
            echo "ERROR: could not parse a pid from 'simctl launch' output: $LAUNCH_1" >&2
            exit 1
          fi
          echo "First launch pid: $PID_1"

          CONTAINER_DATA=$(xcrun simctl get_app_container "$DEVICE_ID" "$BUNDLE_ID" data)
          STATE_FILE="$CONTAINER_DATA/Documents/CircuitProof/dataloom-circuit-state-v1.tsv"
          echo "Resolved on-disk state file: $STATE_FILE"

          echo "=== Waiting for the app's real production write to land on disk ==="
          WROTE_STATE=0
          for _ in $(seq 1 30); do
            if [ -f "$STATE_FILE" ]; then
              WROTE_STATE=1
              break
            fi
            sleep 1
          done
          if [ "$WROTE_STATE" != "1" ]; then
            echo "ERROR: circuit-breaker state file never appeared within 30s: $STATE_FILE" >&2
            exit 1
          fi
          STATE_BEFORE_KILL=$(cat "$STATE_FILE")
          echo "--- Persisted state before kill ---"
          echo "$STATE_BEFORE_KILL"

          echo "=== Killing the app with a genuine OS-level 'xcrun simctl terminate' ==="
          xcrun simctl terminate "$DEVICE_ID" "$BUNDLE_ID" || true

          echo "=== Polling until the OS confirms the process is actually gone ==="
          # simctl has no single "is this bundle id's process still running"
          # query; this polls `launchctl list` inside the simulator's launchd
          # for any entry mentioning the bundle id, matching this repository's
          # "fail loudly on a timeout rather than assume success" testing
          # discipline (see AndroidProcessTerminationCircuitBreakerInstrumentedTest's
          # equivalent ActivityManager.getRunningAppProcesses poll). The exact
          # launchctl label format for a simulator app process was not
          # verified ahead of time (no macOS host was available) -- this
          # deliberately greps for the bundle id as a substring rather than
          # asserting an exact label shape.
          TERMINATED=0
          for _ in $(seq 1 30); do
            if ! xcrun simctl spawn "$DEVICE_ID" launchctl list 2>/dev/null | grep -q "$BUNDLE_ID"; then
              TERMINATED=1
              break
            fi
            sleep 1
          done
          if [ "$TERMINATED" != "1" ]; then
            echo "ERROR: process for $BUNDLE_ID did not disappear from launchctl list within 30s." >&2
            xcrun simctl spawn "$DEVICE_ID" launchctl list || true
            exit 1
          fi

          echo "=== Relaunching (must be a genuinely new OS process) ==="
          LAUNCH_2=$(xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID")
          echo "$LAUNCH_2"
          PID_2=$(echo "$LAUNCH_2" | sed -n 's/^.*: *\([0-9][0-9]*\)$/\1/p')
          if [ -z "$PID_2" ]; then
            echo "ERROR: could not parse a pid from the relaunch 'simctl launch' output: $LAUNCH_2" >&2
            exit 1
          fi
          echo "Relaunch pid: $PID_2"

          if [ "$PID_1" = "$PID_2" ]; then
            echo "ERROR: relaunch pid ($PID_2) is identical to the pre-kill pid ($PID_1)." >&2
            echo "This would mean simctl terminate/launch did not produce a genuinely new OS process." >&2
            exit 1
          fi

          echo "=== Reading persisted state back from the relaunched process's container ==="
          sleep 2
          if [ ! -f "$STATE_FILE" ]; then
            echo "ERROR: state file disappeared after relaunch: $STATE_FILE" >&2
            exit 1
          fi
          STATE_AFTER_RELAUNCH=$(cat "$STATE_FILE")
          echo "--- Persisted state after kill + relaunch ---"
          echo "$STATE_AFTER_RELAUNCH"

          if [ "$STATE_BEFORE_KILL" != "$STATE_AFTER_RELAUNCH" ]; then
            echo "ERROR: persisted circuit-breaker state changed across a genuine OS process kill/relaunch." >&2
            diff <(echo "$STATE_BEFORE_KILL") <(echo "$STATE_AFTER_RELAUNCH") || true
            exit 1
          fi

          echo "OK: circuit-breaker state survived a genuine 'xcrun simctl terminate' + relaunch."
          echo "    pid before kill: $PID_1"
          echo "    pid after relaunch: $PID_2"

      - name: Clean up the Simulator device
        if: always()
        env:
          DEVICE_ID: ${{ steps.boot_simulator.outputs.device_id }}
          BUNDLE_ID: io.dataloom.processterminationproof.app
        run: |
          if [ -n "${DEVICE_ID:-}" ]; then
            xcrun simctl terminate "$DEVICE_ID" "$BUNDLE_ID" || true
            xcrun simctl shutdown "$DEVICE_ID" || true
            xcrun simctl delete "$DEVICE_ID" || true
          fi

  # ---------------------------------------------------------------------
  # Apple Simulator process-termination/relaunch proof (#94, retry budget)
  # ---------------------------------------------------------------------
  #
  # Mechanical extension of apple-process-termination-proof above from
  # circuit-breaker state to durable retry-budget state, the same way
  # AndroidProcessTerminationRetryBudgetInstrumentedTest mechanically
  # extended AndroidProcessTerminationCircuitBreakerInstrumentedTest on
  # Android. See docs/apple/process-termination-proof.md's "What remains
  # open" section (round-31 PR #395) for the gap this closes, and
  # AppleRetryBudgetProcessTerminationProof's own KDoc
  # (apple-process-termination-proof/src/iosMain/.../AppleRetryBudgetProcessTerminationProof.kt)
  # for exactly why retry-budget state is a genuinely separate durable
  # structure from circuit-breaker state on both platforms (Android:
  # queue_entries columns vs the independent circuit_breaker_states table;
  # Apple: AppleFileQueueProvider's QueueEntry.retryAttempt/retryBudgetState
  # vs the independent AppleFileCircuitBreakerStateStore).
  #
  # A separate job from both apple-validate and apple-process-termination-proof
  # above (own checkout/Java/Gradle setup, own Simulator device) so a failure
  # in this brand-new, never-run-before job cannot fail either of those two
  # already-proven jobs, and vice versa -- the same isolation rationale
  # apple-process-termination-proof itself was given from apple-validate in
  # round 31. Neither the existing apple-validate job nor the existing
  # apple-process-termination-proof job (or its app/XCFramework) is modified
  # by this addition.
  #
  # This uses a genuinely separate app project
  # (apple-process-termination-proof-retry-budget-app/, its own .xcodeproj,
  # its own bundle id io.dataloom.processterminationproof.retrybudget.app)
  # rather than adding a second write to ProcessTerminationProofApp's own
  # single launch: the circuit-breaker and retry-budget proofs persist to
  # genuinely distinct on-disk snapshot files owned by two independent
  # production stores (dataloom-circuit-state-v1.tsv from
  # AppleFileCircuitBreakerStateStore vs dataloom-queue-state-v1.tsv from
  # AppleFileQueueProvider), so combining them into one app/process would
  # only add shared-failure risk to the already-proven circuit-breaker path
  # for no proof-relevant benefit. Both apps link the same
  # DataLoomProcessTerminationProof.xcframework produced by the one Kotlin
  # module -- the module now exports two independent proof objects
  # (AppleCircuitBreakerProcessTerminationProof, unchanged, and the new
  # AppleRetryBudgetProcessTerminationProof) from the same XCFramework.
  #
  # Genuine green runs observed on real macOS CI (round 33, 2026-09-17):
  # real distinct pids before/after a genuine `xcrun simctl terminate` +
  # relaunch, retry-budget queue state confirmed byte-identical, across
  # three separate runs including one on main itself. Now a required check
  # like every other job in this workflow -- continue-on-error is no longer
  # needed, matching the same bar apple-process-termination-proof's own
  # circuit-breaker job cleared in round 31.
  apple-retry-budget-process-termination-proof:
    name: Apple Simulator process-termination/relaunch proof (retry budget)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Assemble the process-termination-proof XCFramework
        run: >-
          ./gradlew
          :apple-process-termination-proof:assembleDataLoomProcessTerminationProofReleaseXCFramework
          --configuration-cache
          --stacktrace
          --console=plain

      - name: Copy XCFramework into the retry-budget proof app's project directory
        run: |
          set -euo pipefail
          SRC="apple-process-termination-proof/build/XCFrameworks/release/DataLoomProcessTerminationProof.xcframework"
          DEST="apple-process-termination-proof-retry-budget-app/DataLoomProcessTerminationProof.xcframework"
          echo "=== Copying $SRC -> $DEST ==="
          ls -la "$SRC"
          rm -rf "$DEST"
          cp -R "$SRC" "$DEST"

      - name: Build the retry-budget proof app for the iOS Simulator
        run: |
          set -euo pipefail
          cd apple-process-termination-proof-retry-budget-app
          xcodebuild build \
            -project RetryBudgetProcessTerminationProofApp.xcodeproj \
            -scheme RetryBudgetProcessTerminationProofApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create and boot a dedicated Simulator device
        id: boot_simulator
        run: |
          set -euo pipefail
          RUNTIMES_JSON=$(xcrun simctl list runtimes --json)
          RUNTIME_ID=$(echo "$RUNTIMES_JSON" \
            | jq -r '[.runtimes[] | select(.isAvailable and (.identifier | startswith("com.apple.CoreSimulator.SimRuntime.iOS")))] | sort_by(.version) | last | .identifier')
          if [ -z "$RUNTIME_ID" ] || [ "$RUNTIME_ID" = "null" ]; then
            echo "ERROR: no available iOS simulator runtime found." >&2
            xcrun simctl list runtimes
            exit 1
          fi
          echo "Selected runtime: $RUNTIME_ID"

          # Pick a device type from the *selected runtime's own*
          # supportedDeviceTypes list -- see apple-process-termination-proof's
          # own step above for why a naive global pick is wrong (the
          # "iPhone 6s Plus" lexicographic-sort bug fixed in round 31).
          DEVICETYPE_ID=$(echo "$RUNTIMES_JSON" \
            | jq -r --arg rid "$RUNTIME_ID" '
                [.runtimes[] | select(.identifier == $rid) | .supportedDeviceTypes[]
                  | select(.name | contains("iPhone"))]
                | last | .identifier')
          if [ -z "$DEVICETYPE_ID" ] || [ "$DEVICETYPE_ID" = "null" ]; then
            echo "ERROR: no iPhone simulator device type supported by runtime $RUNTIME_ID." >&2
            echo "$RUNTIMES_JSON" | jq --arg rid "$RUNTIME_ID" '.runtimes[] | select(.identifier == $rid)'
            exit 1
          fi
          echo "Selected device type: $DEVICETYPE_ID"

          DEVICE_ID=$(xcrun simctl create RetryBudgetProcessTerminationProofDevice "$DEVICETYPE_ID" "$RUNTIME_ID")
          echo "Created device: $DEVICE_ID"
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Install, launch, kill, relaunch, and verify persisted retry-budget state
        env:
          DEVICE_ID: ${{ steps.boot_simulator.outputs.device_id }}
          BUNDLE_ID: io.dataloom.processterminationproof.retrybudget.app
        run: |
          set -euo pipefail
          APP_PATH="apple-process-termination-proof-retry-budget-app/build/Build/Products/Debug-iphonesimulator/RetryBudgetProcessTerminationProofApp.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: built app not found at $APP_PATH" >&2
            find apple-process-termination-proof-retry-budget-app/build/Build/Products -maxdepth 3 || true
            exit 1
          fi

          xcrun simctl install "$DEVICE_ID" "$APP_PATH"

          echo "=== First launch (pre-kill) ==="
          LAUNCH_1=$(xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID")
          echo "$LAUNCH_1"
          PID_1=$(echo "$LAUNCH_1" | sed -n 's/^.*: *\([0-9][0-9]*\)$/\1/p')
          if [ -z "$PID_1" ]; then
            echo "ERROR: could not parse a pid from 'simctl launch' output: $LAUNCH_1" >&2
            exit 1
          fi
          echo "First launch pid: $PID_1"

          CONTAINER_DATA=$(xcrun simctl get_app_container "$DEVICE_ID" "$BUNDLE_ID" data)
          STATE_FILE="$CONTAINER_DATA/Documents/RetryBudgetProof/dataloom-queue-state-v1.tsv"
          echo "Resolved on-disk state file: $STATE_FILE"

          echo "=== Waiting for the app's real production write to land on disk ==="
          WROTE_STATE=0
          for _ in $(seq 1 30); do
            if [ -f "$STATE_FILE" ]; then
              WROTE_STATE=1
              break
            fi
            sleep 1
          done
          if [ "$WROTE_STATE" != "1" ]; then
            echo "ERROR: retry-budget queue state file never appeared within 30s: $STATE_FILE" >&2
            exit 1
          fi
          STATE_BEFORE_KILL=$(cat "$STATE_FILE")
          echo "--- Persisted state before kill ---"
          echo "$STATE_BEFORE_KILL"

          echo "=== Killing the app with a genuine OS-level 'xcrun simctl terminate' ==="
          xcrun simctl terminate "$DEVICE_ID" "$BUNDLE_ID" || true

          echo "=== Polling until the OS confirms the process is actually gone ==="
          # Same launchctl-list-grep polling strategy as
          # apple-process-termination-proof's own step above -- see that
          # step's comment for the format uncertainty this deliberately
          # tolerates (grep-based substring match, not an exact label
          # assertion), already resolved once for that job's own bundle id
          # but re-verified independently here for this job's own bundle id.
          TERMINATED=0
          for _ in $(seq 1 30); do
            if ! xcrun simctl spawn "$DEVICE_ID" launchctl list 2>/dev/null | grep -q "$BUNDLE_ID"; then
              TERMINATED=1
              break
            fi
            sleep 1
          done
          if [ "$TERMINATED" != "1" ]; then
            echo "ERROR: process for $BUNDLE_ID did not disappear from launchctl list within 30s." >&2
            xcrun simctl spawn "$DEVICE_ID" launchctl list || true
            exit 1
          fi

          echo "=== Relaunching (must be a genuinely new OS process) ==="
          LAUNCH_2=$(xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID")
          echo "$LAUNCH_2"
          PID_2=$(echo "$LAUNCH_2" | sed -n 's/^.*: *\([0-9][0-9]*\)$/\1/p')
          if [ -z "$PID_2" ]; then
            echo "ERROR: could not parse a pid from the relaunch 'simctl launch' output: $LAUNCH_2" >&2
            exit 1
          fi
          echo "Relaunch pid: $PID_2"

          if [ "$PID_1" = "$PID_2" ]; then
            echo "ERROR: relaunch pid ($PID_2) is identical to the pre-kill pid ($PID_1)." >&2
            echo "This would mean simctl terminate/launch did not produce a genuinely new OS process." >&2
            exit 1
          fi

          echo "=== Reading persisted retry-budget state back from the relaunched process's container ==="
          sleep 2
          if [ ! -f "$STATE_FILE" ]; then
            echo "ERROR: state file disappeared after relaunch: $STATE_FILE" >&2
            exit 1
          fi
          STATE_AFTER_RELAUNCH=$(cat "$STATE_FILE")
          echo "--- Persisted state after kill + relaunch ---"
          echo "$STATE_AFTER_RELAUNCH"

          if [ "$STATE_BEFORE_KILL" != "$STATE_AFTER_RELAUNCH" ]; then
            echo "ERROR: persisted retry-budget queue state changed across a genuine OS process kill/relaunch." >&2
            diff <(echo "$STATE_BEFORE_KILL") <(echo "$STATE_AFTER_RELAUNCH") || true
            exit 1
          fi

          echo "OK: retry-budget queue state survived a genuine 'xcrun simctl terminate' + relaunch."
          echo "    pid before kill: $PID_1"
          echo "    pid after relaunch: $PID_2"

      - name: Clean up the Simulator device
        if: always()
        env:
          DEVICE_ID: ${{ steps.boot_simulator.outputs.device_id }}
          BUNDLE_ID: io.dataloom.processterminationproof.retrybudget.app
        run: |
          if [ -n "${DEVICE_ID:-}" ]; then
            xcrun simctl terminate "$DEVICE_ID" "$BUNDLE_ID" || true
            xcrun simctl shutdown "$DEVICE_ID" || true
            xcrun simctl delete "$DEVICE_ID" || true
          fi

  # Apple Simulator cross-process probe-contention proof (#94/#95)
  # ---------------------------------------------------------------------
  #
  # A separate job from both apple-validate and apple-process-termination-proof
  # above, for the same reason apple-process-termination-proof was kept
  # separate from apple-validate: this is new, never-run-before infrastructure
  # (see docs/apple/cross-process-contention-investigation.md and
  # docs/apple/process-contention-proof.md) and must not risk either
  # already-proven job.
  #
  # This job builds and installs TWO real, independently bundle-identified
  # iOS Simulator apps (ProcessContentionProofAppA / ...AppB,
  # apple-process-contention-proof-app/) from the same shared Swift source
  # and Kotlin/Native module, launches both as genuinely separate OS
  # processes pointed at the same shared host-filesystem directory (possible
  # without an Apple Developer Program "App Groups" entitlement only because
  # the iOS Simulator does not sandbox apps against the host Mac's
  # filesystem the way a real device does -- see the investigation doc),
  # releases them together via a shared "go" marker file once both are
  # confirmed alive and waiting, and asserts that exactly one of the two
  # real, independently-launched processes wins the circuit breaker's single
  # half-open probe permit through AppleFileCircuitBreakerStateStore's real
  # flock-based compare-and-set -- never a test-only mutex -- mirroring
  # AndroidCircuitBreakerProbeContentionInstrumentedTest's own assertions.
  #
  # Genuine green runs observed on real macOS CI (round 33, 2026-09-17): the
  # core mechanism -- two genuinely independent Simulator apps racing on a
  # shared, unsandboxed host-filesystem path -- confirmed real across five
  # separate runs (real distinct pids each time, exactly one ALLOWED/one
  # REJECTED(PROBE_IN_FLIGHT), persisted state confirmed HALF_OPEN),
  # including one on main itself. Now a required check like every other job
  # in this workflow -- continue-on-error is no longer needed, matching the
  # same bar apple-process-termination-proof's own circuit-breaker job
  # cleared in round 31 (see docs/apple/process-contention-proof.md's
  # "Update: first real macOS CI run" section for the full account,
  # including two genuine bugs found and fixed along the way).
  apple-process-contention-proof:
    name: Apple Simulator cross-process probe-contention proof (circuit breaker)
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Assemble the process-contention-proof XCFramework
        run: >-
          ./gradlew
          :apple-process-contention-proof:assembleDataLoomProcessContentionProofReleaseXCFramework
          --configuration-cache
          --stacktrace
          --console=plain

      - name: Copy XCFramework into the proof app's project directory
        run: |
          set -euo pipefail
          SRC="apple-process-contention-proof/build/XCFrameworks/release/DataLoomProcessContentionProof.xcframework"
          DEST="apple-process-contention-proof-app/DataLoomProcessContentionProof.xcframework"
          echo "=== Copying $SRC -> $DEST ==="
          ls -la "$SRC"
          rm -rf "$DEST"
          cp -R "$SRC" "$DEST"

      - name: Build both proof apps for the iOS Simulator
        run: |
          set -euo pipefail
          cd apple-process-contention-proof-app
          for SCHEME in ProcessContentionProofAppA ProcessContentionProofAppB; do
            echo "=== Building $SCHEME ==="
            xcodebuild build \
              -project ProcessContentionProofApp.xcodeproj \
              -scheme "$SCHEME" \
              -configuration Debug \
              -sdk iphonesimulator \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          done

      - name: Create and boot a dedicated Simulator device
        id: boot_simulator
        run: |
          set -euo pipefail
          RUNTIMES_JSON=$(xcrun simctl list runtimes --json)
          RUNTIME_ID=$(echo "$RUNTIMES_JSON" \
            | jq -r '[.runtimes[] | select(.isAvailable and (.identifier | startswith("com.apple.CoreSimulator.SimRuntime.iOS")))] | sort_by(.version) | last | .identifier')
          if [ -z "$RUNTIME_ID" ] || [ "$RUNTIME_ID" = "null" ]; then
            echo "ERROR: no available iOS simulator runtime found." >&2
            xcrun simctl list runtimes
            exit 1
          fi
          echo "Selected runtime: $RUNTIME_ID"

          # See apple-process-termination-proof's own identical step for why
          # candidates are restricted to this runtime's own
          # supportedDeviceTypes rather than picked from the global
          # device-type list: a naive global pick can select a device type
          # the runtime doesn't actually support (that job's own first real
          # CI run caught exactly this).
          DEVICETYPE_ID=$(echo "$RUNTIMES_JSON" \
            | jq -r --arg rid "$RUNTIME_ID" '
                [.runtimes[] | select(.identifier == $rid) | .supportedDeviceTypes[]
                  | select(.name | contains("iPhone"))]
                | last | .identifier')
          if [ -z "$DEVICETYPE_ID" ] || [ "$DEVICETYPE_ID" = "null" ]; then
            echo "ERROR: no iPhone simulator device type supported by runtime $RUNTIME_ID." >&2
            echo "$RUNTIMES_JSON" | jq --arg rid "$RUNTIME_ID" '.runtimes[] | select(.identifier == $rid)'
            exit 1
          fi
          echo "Selected device type: $DEVICETYPE_ID"

          DEVICE_ID=$(xcrun simctl create ProcessContentionProofDevice "$DEVICETYPE_ID" "$RUNTIME_ID")
          echo "Created device: $DEVICE_ID"
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Install both apps, race them, and verify exactly one winner
        env:
          DEVICE_ID: ${{ steps.boot_simulator.outputs.device_id }}
          BUNDLE_ID_A: io.dataloom.processcontentionproof.appa
          BUNDLE_ID_B: io.dataloom.processcontentionproof.appb
        run: |
          set -euo pipefail
          APP_A_PATH="apple-process-contention-proof-app/build/Build/Products/Debug-iphonesimulator/ProcessContentionProofAppA.app"
          APP_B_PATH="apple-process-contention-proof-app/build/Build/Products/Debug-iphonesimulator/ProcessContentionProofAppB.app"
          for APP_PATH in "$APP_A_PATH" "$APP_B_PATH"; do
            if [ ! -d "$APP_PATH" ]; then
              echo "ERROR: built app not found at $APP_PATH" >&2
              find apple-process-contention-proof-app/build/Build/Products -maxdepth 3 || true
              exit 1
            fi
          done

          xcrun simctl install "$DEVICE_ID" "$APP_A_PATH"
          xcrun simctl install "$DEVICE_ID" "$APP_B_PATH"

          # A plain host-filesystem directory, not a Simulator app-container
          # path -- this is the concrete consequence of the Simulator's lack
          # of app sandboxing this proof relies on (see
          # docs/apple/cross-process-contention-investigation.md): both
          # independently bundle-identified apps, and this very shell
          # script, all read and write the same real directory on the
          # runner's own filesystem with no App Groups entitlement, no
          # simctl get_app_container resolution, and no provisioning profile
          # involved.
          SHARED_DIR="${RUNNER_TEMP}/dataloom-cross-process-proof"
          rm -rf "$SHARED_DIR"
          mkdir -p "$SHARED_DIR"
          READY_A="$SHARED_DIR/ready-a.marker"
          READY_B="$SHARED_DIR/ready-b.marker"
          GO_SIGNAL="$SHARED_DIR/go.marker"
          RESULT_A="$SHARED_DIR/result-a.tsv"
          RESULT_B="$SHARED_DIR/result-b.tsv"
          echo "Shared host directory: $SHARED_DIR"

          echo "=== Launching app A (opens the circuit, then waits for the go signal) ==="
          export SIMCTL_CHILD_DATALOOM_ROLE="A"
          export SIMCTL_CHILD_DATALOOM_SHARED_DIR="$SHARED_DIR"
          export SIMCTL_CHILD_DATALOOM_READY_MARKER="$READY_A"
          export SIMCTL_CHILD_DATALOOM_GO_SIGNAL="$GO_SIGNAL"
          export SIMCTL_CHILD_DATALOOM_RESULT_FILE="$RESULT_A"
          LAUNCH_A=$(xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID_A")
          echo "$LAUNCH_A"
          PID_A=$(echo "$LAUNCH_A" | sed -n 's/^.*: *\([0-9][0-9]*\)$/\1/p')
          if [ -z "$PID_A" ]; then
            echo "ERROR: could not parse a pid from app A's 'simctl launch' output: $LAUNCH_A" >&2
            exit 1
          fi
          echo "App A pid: $PID_A"

          echo "=== Waiting for app A to finish opening the circuit ==="
          READY_A_SEEN=0
          for _ in $(seq 1 30); do
            if [ -f "$READY_A" ]; then
              READY_A_SEEN=1
              break
            fi
            sleep 1
          done
          if [ "$READY_A_SEEN" != "1" ]; then
            echo "ERROR: app A's ready marker never appeared within 30s: $READY_A" >&2
            exit 1
          fi

          # Real wall-clock sleep past the 400ms openDuration, comfortably
          # exceeded already by the polling above but made explicit here to
          # not depend on that incidental timing.
          sleep 2

          echo "=== Launching app B (the non-opening racer) ==="
          unset SIMCTL_CHILD_DATALOOM_ROLE
          export SIMCTL_CHILD_DATALOOM_ROLE="B"
          export SIMCTL_CHILD_DATALOOM_READY_MARKER="$READY_B"
          export SIMCTL_CHILD_DATALOOM_RESULT_FILE="$RESULT_B"
          # SIMCTL_CHILD_DATALOOM_SHARED_DIR and SIMCTL_CHILD_DATALOOM_GO_SIGNAL
          # are unchanged from app A's launch above -- both apps must race on
          # the exact same shared directory and the exact same go signal.
          LAUNCH_B=$(xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID_B")
          echo "$LAUNCH_B"
          PID_B=$(echo "$LAUNCH_B" | sed -n 's/^.*: *\([0-9][0-9]*\)$/\1/p')
          if [ -z "$PID_B" ]; then
            echo "ERROR: could not parse a pid from app B's 'simctl launch' output: $LAUNCH_B" >&2
            exit 1
          fi
          echo "App B pid: $PID_B"

          if [ "$PID_A" = "$PID_B" ]; then
            echo "ERROR: app A and app B were launched with the identical pid ($PID_A) -- they are not genuinely separate OS processes." >&2
            exit 1
          fi

          echo "=== Waiting for app B to be alive and polling ==="
          READY_B_SEEN=0
          for _ in $(seq 1 30); do
            if [ -f "$READY_B" ]; then
              READY_B_SEEN=1
              break
            fi
            sleep 1
          done
          if [ "$READY_B_SEEN" != "1" ]; then
            echo "ERROR: app B's ready marker never appeared within 30s: $READY_B" >&2
            exit 1
          fi

          echo "=== Both processes confirmed alive and waiting -- releasing them together ==="
          touch "$GO_SIGNAL"

          echo "=== Waiting for both processes' results ==="
          RESULTS_SEEN=0
          for _ in $(seq 1 30); do
            if [ -f "$RESULT_A" ] && [ -f "$RESULT_B" ]; then
              RESULTS_SEEN=1
              break
            fi
            sleep 1
          done
          if [ "$RESULTS_SEEN" != "1" ]; then
            echo "ERROR: one or both result files never appeared within 30s (A: $RESULT_A, B: $RESULT_B)." >&2
            [ -f "$RESULT_A" ] && { echo "--- result-a.tsv ---"; cat "$RESULT_A"; } || echo "result-a.tsv missing"
            [ -f "$RESULT_B" ] && { echo "--- result-b.tsv ---"; cat "$RESULT_B"; } || echo "result-b.tsv missing"
            exit 1
          fi

          # Deliberately NOT `IFS=$'\t' read -r a b c < file`: bash's `read`
          # treats tab as one of its built-in "IFS whitespace" characters
          # regardless of what IFS is explicitly set to, so it collapses
          # consecutive tabs and strips a leading/trailing empty field --
          # exactly the shape a winning ALLOWED result produces (its own
          # rejectionReason field is empty: "ALLOWED\t\t1"). That silently
          # shifted the real generation value into the reason variable and
          # left the generation variable empty, which this script did not
          # catch until this exact bug was found on a genuine CI run below.
          # `cut` with an explicit tab delimiter treats every tab as a
          # literal, non-collapsing field separator instead.
          OUTCOME_A=$(cut -d$'\t' -f1 "$RESULT_A")
          REASON_A=$(cut -d$'\t' -f2 "$RESULT_A")
          GENERATION_A=$(cut -d$'\t' -f3 "$RESULT_A")
          OUTCOME_B=$(cut -d$'\t' -f1 "$RESULT_B")
          REASON_B=$(cut -d$'\t' -f2 "$RESULT_B")
          GENERATION_B=$(cut -d$'\t' -f3 "$RESULT_B")
          echo "App A result: outcome=$OUTCOME_A reason=$REASON_A generation=$GENERATION_A"
          echo "App B result: outcome=$OUTCOME_B reason=$REASON_B generation=$GENERATION_B"

          ALLOWED_COUNT=0
          REJECTED_COUNT=0
          [ "$OUTCOME_A" = "ALLOWED" ] && ALLOWED_COUNT=$((ALLOWED_COUNT + 1))
          [ "$OUTCOME_B" = "ALLOWED" ] && ALLOWED_COUNT=$((ALLOWED_COUNT + 1))
          [ "$OUTCOME_A" = "REJECTED" ] && REJECTED_COUNT=$((REJECTED_COUNT + 1))
          [ "$OUTCOME_B" = "REJECTED" ] && REJECTED_COUNT=$((REJECTED_COUNT + 1))

          if [ "$ALLOWED_COUNT" != "1" ]; then
            echo "ERROR: expected exactly one ALLOWED outcome, got $ALLOWED_COUNT (A=$OUTCOME_A, B=$OUTCOME_B)." >&2
            exit 1
          fi
          if [ "$REJECTED_COUNT" != "1" ]; then
            echo "ERROR: expected exactly one REJECTED outcome, got $REJECTED_COUNT (A=$OUTCOME_A, B=$OUTCOME_B)." >&2
            exit 1
          fi

          if [ "$OUTCOME_A" = "REJECTED" ]; then
            LOSER_REASON="$REASON_A"
            WINNER_GENERATION="$GENERATION_B"
          else
            LOSER_REASON="$REASON_B"
            WINNER_GENERATION="$GENERATION_A"
          fi
          if [ "$LOSER_REASON" != "PROBE_IN_FLIGHT" ]; then
            echo "ERROR: the losing process's rejection reason was '$LOSER_REASON', expected 'PROBE_IN_FLIGHT'." >&2
            exit 1
          fi
          if [ "$WINNER_GENERATION" -le 0 ]; then
            echo "ERROR: the winning process's granted probe generation was '$WINNER_GENERATION', expected a positive integer." >&2
            exit 1
          fi

          echo "=== Bonus corroboration: reading the real production state file directly ==="
          # AppleFileCircuitBreakerStateStore's own on-disk file, written by
          # whichever of the two real app processes performed the winning
          # compare-and-set -- read here directly from the plain shared host
          # directory both apps were launched against (no simctl
          # get_app_container indirection is needed for this file, since it
          # was never written inside either app's own sandboxed container in
          # the first place).
          STATE_FILE="$SHARED_DIR/dataloom-circuit-state-v1.tsv"
          if [ -f "$STATE_FILE" ]; then
            echo "--- $STATE_FILE ---"
            cat "$STATE_FILE"
            if ! grep -q "HALF_OPEN" "$STATE_FILE"; then
              echo "ERROR: persisted state file does not contain phase HALF_OPEN after the race." >&2
              exit 1
            fi
          else
            echo "ERROR: expected production state file not found: $STATE_FILE" >&2
            exit 1
          fi

          echo "OK: exactly one of two genuinely separate Simulator app processes won the half-open probe permit."
          echo "    pid A: $PID_A, pid B: $PID_B"
          echo "    winner outcome: ALLOWED (generation $WINNER_GENERATION), loser: REJECTED (PROBE_IN_FLIGHT)"

      - name: Clean up the Simulator device and shared directory
        if: always()
        env:
          DEVICE_ID: ${{ steps.boot_simulator.outputs.device_id }}
          BUNDLE_ID_A: io.dataloom.processcontentionproof.appa
          BUNDLE_ID_B: io.dataloom.processcontentionproof.appb
        run: |
          if [ -n "${DEVICE_ID:-}" ]; then
            xcrun simctl terminate "$DEVICE_ID" "$BUNDLE_ID_A" || true
            xcrun simctl terminate "$DEVICE_ID" "$BUNDLE_ID_B" || true
            xcrun simctl shutdown "$DEVICE_ID" || true
            xcrun simctl delete "$DEVICE_ID" || true
          fi
          rm -rf "${RUNNER_TEMP}/dataloom-cross-process-proof" || true
