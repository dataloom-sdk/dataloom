name: Temporary Protected Strategy Evidence

on:
  push:
    branches:
      - codex/dl-retry-038-protected-strategy-execution

permissions:
  contents: write

concurrency:
  group: temporary-protected-strategy-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify-and-commit:
    runs-on: macos-15
    timeout-minutes: 50

    steps:
      - name: Checkout protected strategy branch
        uses: actions/checkout@v6
        with:
          ref: codex/dl-retry-038-protected-strategy-execution
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Index protected strategy documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/api/README.md")
          text = path.read_text()
          row = "| [Provider-protected strategy execution](./provider-protected-strategy-execution.md) | Partial V1 subsystem | Plan-aware network-only and remote-first timeout/circuit protection with independent local-fallback policy and bounded ordered evidence. |"
          if row not in text:
              anchor = "| [DataLoomBuilder provider protection](./builder-provider-protection.md) | Partial V1 subsystem | Explicit facade assembly for protected direct synchronization with durable stores and exact operation scopes. |"
              if anchor not in text:
                  raise SystemExit("Builder provider protection documentation anchor not found")
              text = text.replace(anchor, anchor + "\n" + row, 1)
          text = text.replace(
              "V1 retry work still requires strategy and queued-execution adoption,",
              "V1 retry work still requires complete offline-first, cache-first, hybrid, and adaptive strategy execution,",
          )
          path.write_text(text)
          PY

      - name: Run focused common and external consumer tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :dataloom-runtime:jvmTest \
            :dataloom-runtime:iosSimulatorArm64Test \
            :runtime-external-consumer:compileKotlinJvm \
            :runtime-external-consumer:compileKotlinIosArm64 \
            :runtime-external-consumer:compileKotlinIosSimulatorArm64 \
            :runtime-external-consumer:compileKotlinIosX64 \
            --configuration-cache \
            --stacktrace \
            --warning-mode all \
            --console=plain

      - name: Generate exact JVM and Kotlin Native ABI baselines
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :dataloom-runtime:updateKotlinAbi \
            :dataloom-apple:updateKotlinAbi \
            --no-configuration-cache \
            --stacktrace \
            --console=plain

      - name: Validate ABI boundaries consumers and Apple framework
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :dataloom-runtime:checkKotlinAbi \
            :dataloom-runtime:checkPublicAbiBoundaries \
            :dataloom-apple:checkKotlinAbi \
            :runtime-external-consumer:checkRuntimeExternalConsumer \
            :dataloom-apple:assembleDataLoomReleaseXCFramework \
            --no-configuration-cache \
            --stacktrace \
            --warning-mode all \
            --console=plain

      - name: Verify protected strategy evidence
        shell: bash
        run: |
          set -euo pipefail
          grep -F "ProviderProtectedStrategySynchronizationResult" \
            dataloom-runtime/api/dataloom-runtime.api
          grep -F "DataLoomStrategyProviderProtectionSpec" \
            dataloom-runtime/api/dataloom-runtime.klib.api
          grep -F "StrategyLocalFallbackCircuitOperation" \
            dataloom-runtime/api/dataloom-runtime.api
          grep -F "ProtectedStrategySynchronizationExternalConsumerProbe" \
            runtime-external-consumer/src/commonMain/kotlin/io/dataloom/consumer/ProtectedStrategySynchronizationExternalConsumerProbe.kt
          grep -F "provider-protected-strategy-execution.md" docs/api/README.md
          test -d dataloom-apple/build/XCFrameworks/release/DataLoom.xcframework
          git diff --check

      - name: Commit generated evidence and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temporary-protected-strategy-evidence.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No protected strategy evidence to commit."
            exit 1
          fi
          git commit -m "DL-040: qualify provider-protected strategy execution"
          git push origin HEAD:codex/dl-retry-038-protected-strategy-execution
