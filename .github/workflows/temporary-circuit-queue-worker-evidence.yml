name: Temporary Circuit Queue Worker Evidence

on:
  push:
    branches:
      - codex/dl-retry-028-circuit-queue-worker
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: temporary-circuit-queue-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-commit:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout review branch
        uses: actions/checkout@v6
        with:
          ref: codex/dl-retry-028-circuit-queue-worker
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Apply test and documentation corrections
        run: python3 .github/scripts/temporary_circuit_queue_worker_patch.py

      - name: Compile and test circuit-aware queue worker
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :dataloom-runtime:jvmTest \
            :dataloom-runtime:iosSimulatorArm64Test \
            :runtime-external-consumer:compileKotlinJvm \
            :runtime-external-consumer:compileKotlinIosArm64 \
            :runtime-external-consumer:compileKotlinIosSimulatorArm64 \
            :runtime-external-consumer:compileKotlinIosX64 \
            --configuration-cache \
            --stacktrace \
            --warning-mode all \
            --console=plain

      - name: Generate exact public ABI baselines
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :dataloom-runtime:updateKotlinAbi \
            :dataloom-apple:updateKotlinAbi \
            --no-configuration-cache \
            --stacktrace \
            --console=plain

      - name: Validate ABI consumers and Apple framework
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :dataloom-runtime:checkKotlinAbi \
            :dataloom-runtime:checkPublicAbiBoundaries \
            :dataloom-apple:checkKotlinAbi \
            :runtime-external-consumer:checkRuntimeExternalConsumer \
            :dataloom-apple:assembleDataLoomReleaseXCFramework \
            --no-configuration-cache \
            --stacktrace \
            --warning-mode all \
            --console=plain

      - name: Verify generated circuit queue worker evidence
        shell: bash
        run: |
          set -euo pipefail
          grep -F "CircuitBreakerQueueWorkerCoordinator" \
            dataloom-runtime/api/dataloom-runtime.api
          grep -F "CircuitBreakerQueueWorkerRuntime" \
            dataloom-runtime/api/dataloom-runtime.klib.api
          grep -F "CircuitBreakerQueueWorkerRecoveryResult" \
            dataloom-runtime/api/dataloom-runtime.klib.api
          if grep -F "CircuitBreakerQueueProcessingEngine" \
            dataloom-runtime/api/dataloom-runtime.api \
            dataloom-runtime/api/dataloom-runtime.klib.api; then
            echo "Internal queue-processing seam leaked into public ABI."
            exit 1
          fi
          grep -F "Circuit-aware queue worker" docs/api/circuit-queue-worker.md
          grep -F "circuit-aware queue worker" docs/api/README.md
          grep -F "CircuitQueueWorkerExternalConsumerProbe" \
            runtime-external-consumer/src/commonMain/kotlin/io/dataloom/consumer/CircuitQueueWorkerExternalConsumerProbe.kt
          test -d dataloom-apple/build/XCFrameworks/release/DataLoom.xcframework
          git diff --check

      - name: Commit generated evidence and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/temporary-circuit-queue-worker-evidence.yml \
            .github/scripts/temporary_circuit_queue_worker_patch.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No circuit queue worker evidence to commit."
            exit 1
          fi
          git commit -m "DL-040: qualify circuit-aware queue worker"
          git push origin HEAD:codex/dl-retry-028-circuit-queue-worker
