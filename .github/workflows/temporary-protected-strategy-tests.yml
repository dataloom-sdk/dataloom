name: Temporary Protected Strategy Tests

on:
  push:
    branches:
      - codex/dl-retry-038-protected-strategy-execution

permissions:
  contents: write

concurrency:
  group: temporary-protected-strategy-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-commit:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout protected strategy branch
        uses: actions/checkout@v6
        with:
          ref: codex/dl-retry-038-protected-strategy-execution
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run protected strategy tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :dataloom-runtime:jvmTest \
            :dataloom-runtime:iosSimulatorArm64Test \
            --configuration-cache \
            --stacktrace \
            --warning-mode all \
            --console=plain

      - name: Remove temporary workflow after success
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temporary-protected-strategy-tests.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "DL-040: validate protected strategy behavior"
          git push origin HEAD:codex/dl-retry-038-protected-strategy-execution
