name: Temporary Retry Budget Evidence

on:
  push:
    branches:
      - codex/dl-retry-012-durable-budgets

permissions:
  contents: write

concurrency:
  group: temporary-retry-budget-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-commit:
    name: Validate budgets, generate ABI/schema, and commit evidence
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DATALOOM_ANDROID_BUILD: "true"

    steps:
      - name: Checkout review branch
        uses: actions/checkout@v6
        with:
          ref: codex/dl-retry-012-durable-budgets
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Apply bounded persistence and documentation integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          script_path = Path('.github/scripts/apply_retry_budget_persistence.py')
          script = script_path.read_text(encoding='utf-8')
          source_only = script.split('# Current-state documentation.', 1)[0]
          exec(compile(source_only, str(script_path), 'exec'))

          docs_path = Path('.github/scripts/apply_retry_budget_docs.py')
          docs_source = docs_path.read_text(encoding='utf-8')
          docs_source = docs_source.replace(
              '"Standard backoff policies, deterministic jitter, attempt and elapsed budgets,\\n'
              'retry hints, timeout separation, durable circuit state, half-open probes,"',
              '"Elapsed-time and aggregate-delay budgets, bounded retry hints, timeout\\n'
              'separation, durable circuit state, half-open probes, manual"',
          )
          docs_source = docs_source.replace(
              '"Retry hints, timeout separation, durable circuit state, half-open probes,"',
              '"Bounded retry hints, timeout separation, durable circuit state, half-open\\n'
              'probes, manual"',
          )
          exec(compile(docs_source, str(docs_path), 'exec'))

          test_path = Path(
              'dataloom-runtime/src/commonTest/kotlin/io/dataloom/runtime/retry/'
              'RetryBudgetSchedulerIntegrationTest.kt'
          )
          text = test_path.read_text(encoding='utf-8')
          text = text.replace(
              'import io.dataloom.api.identifier.ProviderId',
              'import io.dataloom.api.provider.ProviderId',
          )
          test_path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Generate ABI, schema, and focused validation
        shell: bash
        run: |
          set -o pipefail
          mkdir -p retry-budget-evidence
          ./gradlew \
            :build-logic:test \
            :dataloom-api:updateKotlinAbi \
            :dataloom-runtime:updateKotlinAbi \
            :dataloom-testing:updateKotlinAbi \
            :dataloom-apple:updateKotlinAbi \
            :dataloom-api:jvmTest \
            :dataloom-runtime:jvmTest \
            :dataloom-testing:jvmTest \
            :runtime-external-consumer:compileKotlinJvm \
            :runtime-external-consumer:compileKotlinIosArm64 \
            :runtime-external-consumer:compileKotlinIosSimulatorArm64 \
            :runtime-external-consumer:compileKotlinIosX64 \
            :dataloom-queue-room:assembleDebug \
            :dataloom-queue-room:assembleRelease \
            :dataloom-queue-room:assembleDebugAndroidTest \
            :dataloom-queue-room:testDebugUnitTest \
            :dataloom-queue-room:lintDebug \
            :dataloom-apple:assembleDataLoomReleaseXCFramework \
            --configuration-cache \
            --stacktrace \
            --warning-mode all \
            --console=plain 2>&1 | tee retry-budget-evidence/gradle.log

      - name: Verify generated Room schema version 2
        shell: bash
        run: |
          set -euo pipefail
          schema='dataloom-queue-room/schemas/io.dataloom.queue.room.internal.DataLoomRoomDatabase/2.json'
          test -f "$schema"
          python3 - "$schema" <<'PY'
          import json
          import pathlib
          import sys

          data = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert data['database']['version'] == 2
          fields = {
              field['columnName']
              for field in data['database']['entities'][0]['fields']
          }
          expected = {
              'retry_window_started_at_ms',
              'retry_last_evaluated_at_ms',
              'retry_cumulative_delay_ms',
          }
          missing = expected - fields
          if missing:
              raise SystemExit(f'Missing retry budget columns: {sorted(missing)}')
          print('Verified Room schema version 2 retry budget columns.')
          PY

      - name: Remove temporary workflow and patch scripts
        shell: bash
        run: |
          rm .github/workflows/temporary-retry-budget-evidence.yml
          rm .github/scripts/apply_retry_budget_persistence.py
          rm .github/scripts/apply_retry_budget_docs.py
          git diff --check

      - name: Commit generated evidence and integrated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'DL-040: integrate durable retry budgets and evidence'
          git push origin HEAD:codex/dl-retry-012-durable-budgets

      - name: Upload focused validation log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: retry-budget-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: retry-budget-evidence
          if-no-files-found: warn
          retention-days: 2
