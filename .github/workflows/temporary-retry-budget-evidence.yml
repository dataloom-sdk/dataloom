name: Temporary Retry Budget Evidence

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: temporary-retry-budget-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-commit:
    name: Validate budgets, generate ABI/schema, and commit evidence
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DATALOOM_ANDROID_BUILD: "true"

    steps:
      - name: Checkout review branch
        uses: actions/checkout@v6
        with:
          ref: codex/dl-retry-012-durable-budgets
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Apply bounded persistence and documentation integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          script_path = Path('.github/scripts/apply_retry_budget_persistence.py')
          script = script_path.read_text(encoding='utf-8')
          source_only = script.split('# Current-state documentation.', 1)[0]
          exec(compile(source_only, str(script_path), 'exec'))

          docs_path = Path('.github/scripts/apply_retry_budget_docs.py')
          docs_source = docs_path.read_text(encoding='utf-8')
          docs_source = docs_source.replace(
              '"Standard backoff policies, deterministic jitter, attempt and elapsed budgets,\\n'
              'retry hints, timeout separation, durable circuit state, half-open probes,"',
              '"Elapsed-time and aggregate-delay budgets, bounded retry hints, timeout\\n'
              'separation, durable circuit state, half-open probes, manual"',
          )
          docs_source = docs_source.replace(
              '"Retry hints, timeout separation, durable circuit state, half-open probes,"',
              '"Bounded retry hints, timeout separation, durable circuit state, half-open\\n'
              'probes, manual"',
          )
          exec(compile(docs_source, str(docs_path), 'exec'))

          scheduler_test_path = Path(
              'dataloom-runtime/src/commonTest/kotlin/io/dataloom/runtime/retry/'
              'RetryBudgetSchedulerIntegrationTest.kt'
          )
          scheduler_text = scheduler_test_path.read_text(encoding='utf-8')
          scheduler_text = scheduler_text.replace(
              'import io.dataloom.api.identifier.ProviderId',
              'import io.dataloom.api.provider.ProviderId',
          )
          scheduler_test_path.write_text(scheduler_text, encoding='utf-8')

          contract_test_path = Path(
              'dataloom-api/src/commonTest/kotlin/io/dataloom/api/retry/'
              'RetryPolicyContractsTest.kt'
          )
          contract_text = contract_test_path.read_text(encoding='utf-8')

          set_anchor = '            RetryStopReason.ATTEMPT_LIMIT_REACHED,\n'
          if contract_text.count(set_anchor) != 1:
              raise RuntimeError('Retry stop-reason set anchor was not unique.')
          contract_text = contract_text.replace(
              set_anchor,
              set_anchor +
              '            RetryStopReason.ELAPSED_TIME_LIMIT_REACHED,\n' +
              '            RetryStopReason.CUMULATIVE_DELAY_LIMIT_REACHED,\n' +
              '            RetryStopReason.CLOCK_REGRESSION_DETECTED,\n',
              1,
          )

          if contract_text.count('        assertEquals(4, reasons.size)') != 1:
              raise RuntimeError('Retry stop-reason count assertion was not unique.')
          contract_text = contract_text.replace(
              '        assertEquals(4, reasons.size)',
              '        assertEquals(7, reasons.size)',
              1,
          )

          when_anchor = '            RetryStopReason.ATTEMPT_LIMIT_REACHED -> true\n'
          if contract_text.count(when_anchor) != 1:
              raise RuntimeError('Retry stop-reason when anchor was not unique.')
          contract_text = contract_text.replace(
              when_anchor,
              when_anchor +
              '            RetryStopReason.ELAPSED_TIME_LIMIT_REACHED -> false\n' +
              '            RetryStopReason.CUMULATIVE_DELAY_LIMIT_REACHED -> false\n' +
              '            RetryStopReason.CLOCK_REGRESSION_DETECTED -> false\n',
              1,
          )
          contract_test_path.write_text(contract_text, encoding='utf-8')

          room_test_path = Path(
              'dataloom-queue-room/src/test/kotlin/io/dataloom/queue/room/'
              'RoomQueueProviderTest.kt'
          )
          room_test = room_test_path.read_text(encoding='utf-8')
          import_anchor = '''import io.dataloom.api.retry.RetryAttempt
          import io.dataloom.api.time.DataLoomInstant'''
          import_replacement = '''import io.dataloom.api.retry.RetryAttempt
          import io.dataloom.api.retry.RetryBudgetState
          import io.dataloom.api.scheduling.SchedulingDelay
          import io.dataloom.api.time.DataLoomInstant'''
          if import_anchor not in room_test:
              raise RuntimeError('Room provider test import anchor was not found.')
          room_test = room_test.replace(import_anchor, import_replacement, 1)

          dao_anchor = '''                    eq(3_000L),
                              eq(2),
                              eq("NETWORK_TEMPORARY"),'''
          dao_replacement = '''                    eq(3_000L),
                              eq(2),
                              eq(1_000L),
                              eq(1_500L),
                              eq(500L),
                              eq("NETWORK_TEMPORARY"),'''
          if dao_anchor not in room_test:
              raise RuntimeError('Room provider DAO expectation anchor was not found.')
          room_test = room_test.replace(dao_anchor, dao_replacement, 1)

          request_anchor = '''                    availableAt = DataLoomInstant(3_000L),
                              error = testError(),
                          ),'''
          request_replacement = '''                    availableAt = DataLoomInstant(3_000L),
                              error = testError(),
                              retryBudgetState = RetryBudgetState(
                                  windowStartedAt = DataLoomInstant(1_000L),
                                  lastEvaluatedAt = DataLoomInstant(1_500L),
                                  cumulativeDelay = SchedulingDelay(500L),
                              ),
                          ),'''
          if request_anchor not in room_test:
              raise RuntimeError('Room provider retry request anchor was not found.')
          room_test_path.write_text(
              room_test.replace(request_anchor, request_replacement, 1),
              encoding='utf-8',
          )
          PY
          git diff --check

      - name: Generate ABI, schema, and focused validation
        shell: bash
        run: |
          set -o pipefail
          mkdir -p retry-budget-evidence
          ./gradlew \
            :dataloom-queue-room:kspDebugKotlin \
            --configuration-cache \
            --stacktrace \
            --console=plain \
            --max-workers=1
          ./gradlew \
            :build-logic:test \
            :dataloom-api:updateKotlinAbi \
            :dataloom-runtime:updateKotlinAbi \
            :dataloom-testing:updateKotlinAbi \
            :dataloom-apple:updateKotlinAbi \
            :dataloom-api:jvmTest \
            :dataloom-runtime:jvmTest \
            :dataloom-testing:jvmTest \
            :runtime-external-consumer:compileKotlinJvm \
            :runtime-external-consumer:compileKotlinIosArm64 \
            :runtime-external-consumer:compileKotlinIosSimulatorArm64 \
            :runtime-external-consumer:compileKotlinIosX64 \
            :dataloom-queue-room:assembleDebug \
            :dataloom-queue-room:assembleRelease \
            :dataloom-queue-room:assembleDebugAndroidTest \
            :dataloom-queue-room:testDebugUnitTest \
            :dataloom-queue-room:lintDebug \
            :dataloom-apple:assembleDataLoomReleaseXCFramework \
            --configuration-cache \
            --stacktrace \
            --warning-mode all \
            --console=plain 2>&1 | tee retry-budget-evidence/gradle.log

      - name: Verify generated Room schema version 2
        shell: bash
        run: |
          set -euo pipefail
          schema='dataloom-queue-room/schemas/io.dataloom.queue.room.internal.DataLoomRoomDatabase/2.json'
          test -f "$schema"
          python3 - "$schema" <<'PY'
          import json
          import pathlib
          import sys

          data = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert data['database']['version'] == 2
          fields = {
              field['columnName']
              for field in data['database']['entities'][0]['fields']
          }
          expected = {
              'retry_window_started_at_ms',
              'retry_last_evaluated_at_ms',
              'retry_cumulative_delay_ms',
          }
          missing = expected - fields
          if missing:
              raise SystemExit(f'Missing retry budget columns: {sorted(missing)}')
          print('Verified Room schema version 2 retry budget columns.')
          PY

      - name: Remove temporary workflow and patch scripts
        shell: bash
        run: |
          rm .github/workflows/temporary-retry-budget-evidence.yml
          rm .github/scripts/apply_retry_budget_persistence.py
          rm .github/scripts/apply_retry_budget_docs.py
          git diff --check

      - name: Commit generated evidence and integrated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'DL-040: integrate durable retry budgets and evidence'
          git push origin HEAD:codex/dl-retry-012-durable-budgets

      - name: Upload focused validation log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: retry-budget-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: retry-budget-evidence
          if-no-files-found: warn
          retention-days: 2
