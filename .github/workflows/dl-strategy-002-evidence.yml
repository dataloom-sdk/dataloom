name: DL-039B Durable Strategy Decision Evidence

on:
  push:
    branches:
      - agent/dl-strategy-002-durable-decision-persistence

permissions:
  contents: write

concurrency:
  group: dl-strategy-002-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify-and-commit:
    name: Apply, qualify, and commit durable strategy decision persistence
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DATALOOM_ANDROID_BUILD: "true"

    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Apply reviewed bounded patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/dl_strategy_002_patch.py
          python3 .github/scripts/dl_strategy_002_patch.py
          git diff --check

      - name: Generate exact Kotlin ABI and Room schema evidence
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            updateKotlinAbi \
            :dataloom-queue-room:kspDebugKotlin \
            --no-parallel \
            --stacktrace \
            --console=plain
          test -f dataloom-queue-room/schemas/io.dataloom.queue.room.internal.DataLoomRoomDatabase/7.json

      - name: Validate common, JVM, Android, Apple, consumers, and XCFramework
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :build-logic:test \
            build \
            :runtime-external-consumer:checkRuntimeExternalConsumer \
            :runtime-external-consumer:compileKotlinIosArm64 \
            :runtime-external-consumer:compileKotlinIosSimulatorArm64 \
            :runtime-external-consumer:compileKotlinIosX64 \
            :dataloom-runtime:iosSimulatorArm64Test \
            :dataloom-queue-room:assembleDebugAndroidTest \
            :dataloom-queue-room:testDebugUnitTest \
            :dataloom-apple:assembleDataLoomReleaseXCFramework \
            checkKotlinAbi \
            --no-parallel \
            --stacktrace \
            --warning-mode all \
            --console=plain

      - name: Verify generated evidence and repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import re

          schema = pathlib.Path(
              "dataloom-queue-room/schemas/"
              "io.dataloom.queue.room.internal.DataLoomRoomDatabase/7.json"
          )
          data = json.loads(schema.read_text())
          assert data["database"]["version"] == 7
          identity = data["database"]["identityHash"]
          assert re.fullmatch(r"[0-9a-f]{32}", identity), identity
          queue = next(
              entity for entity in data["database"]["entities"]
              if entity["tableName"] == "queue_entries"
          )
          columns = {field["columnName"] for field in queue["fields"]}
          expected = {
              "strategy_decision_id",
              "strategy_plan_id",
              "strategy_requested_strategy",
              "strategy_effective_profile_id",
              "strategy_effective_strategy",
              "strategy_configuration_version",
              "strategy_disposition",
          }
          missing = expected - columns
          assert not missing, sorted(missing)
          print(f"Verified Room schema 7 identity {identity}")
          PY
          git diff --check
          if find . -path '*/build/*' -prune -o -name '*.rej' -print | grep -q .; then
            echo "Patch reject files were created."
            exit 1
          fi

      - name: Remove one-time helpers and commit qualified tree
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/dl-strategy-002-evidence.yml
          rm .github/scripts/dl_strategy_002_patch.py
          rm -rf .github/scripts/__pycache__
          git diff --check
          git add -A
          if git diff --cached --quiet; then
            echo "No qualified changes were produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "DL-039B: persist durable strategy decisions"
          git push origin "HEAD:${GITHUB_REF_NAME}"
