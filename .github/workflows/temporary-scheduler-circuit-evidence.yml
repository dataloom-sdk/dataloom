name: Temporary Scheduler Circuit Evidence

on:
  push:
    branches:
      - codex/dl-retry-030-circuit-queue-worker-scheduler

permissions:
  contents: write

concurrency:
  group: temporary-scheduler-circuit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-commit:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout review branch
        uses: actions/checkout@v6
        with:
          ref: codex/dl-retry-030-circuit-queue-worker-scheduler
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Apply scheduler circuit runtime and evidence patches
        run: |
          python3 .github/scripts/temporary_scheduler_circuit_runtime_patch.py
          python3 .github/scripts/temporary_scheduler_circuit_evidence_patch.py
          python3 .github/scripts/temporary_scheduler_circuit_compile_fix.py

      - name: Compile and test scheduler circuit integration
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :dataloom-runtime:jvmTest \
            :dataloom-runtime:iosSimulatorArm64Test \
            :runtime-external-consumer:compileKotlinJvm \
            :runtime-external-consumer:compileKotlinIosArm64 \
            :runtime-external-consumer:compileKotlinIosSimulatorArm64 \
            :runtime-external-consumer:compileKotlinIosX64 \
            --configuration-cache \
            --stacktrace \
            --warning-mode all \
            --console=plain

      - name: Generate exact public ABI baselines
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :dataloom-runtime:updateKotlinAbi \
            :dataloom-apple:updateKotlinAbi \
            --no-configuration-cache \
            --stacktrace \
            --console=plain

      - name: Validate ABI consumers and Apple framework
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :dataloom-runtime:checkKotlinAbi \
            :dataloom-runtime:checkPublicAbiBoundaries \
            :dataloom-apple:checkKotlinAbi \
            :runtime-external-consumer:checkRuntimeExternalConsumer \
            :dataloom-apple:assembleDataLoomReleaseXCFramework \
            --no-configuration-cache \
            --stacktrace \
            --warning-mode all \
            --console=plain

      - name: Verify generated scheduler circuit evidence
        shell: bash
        run: |
          set -euo pipefail
          grep -F "DataLoomCircuitQueueWorkerSchedulerSpec" \
            dataloom-runtime/api/dataloom-runtime.api
          grep -F "SchedulerCircuitOperation" \
            dataloom-runtime/api/dataloom-runtime.klib.api
          grep -F "createWithSchedulerCircuit" \
            dataloom-runtime/api/dataloom-runtime.api
          grep -F "CircuitProtected" \
            dataloom-runtime/api/dataloom-runtime.klib.api
          grep -F "BuilderCircuitQueueWorkerSchedulerExternalConsumerProbe" \
            runtime-external-consumer/src/commonMain/kotlin/io/dataloom/consumer/BuilderCircuitQueueWorkerSchedulerExternalConsumerProbe.kt
          grep -F "Circuit-protected queue-worker scheduling" \
            docs/api/circuit-queue-worker-scheduler.md
          test -d dataloom-apple/build/XCFrameworks/release/DataLoom.xcframework
          git diff --check

      - name: Commit generated evidence and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/temporary-scheduler-circuit-evidence.yml \
            .github/scripts/temporary_scheduler_circuit_runtime_patch.py \
            .github/scripts/temporary_scheduler_circuit_evidence_patch.py \
            .github/scripts/temporary_scheduler_circuit_compile_fix.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No scheduler circuit evidence to commit."
            exit 1
          fi
          git commit -m "DL-040: qualify queue worker scheduler circuit"
          git push origin HEAD:codex/dl-retry-030-circuit-queue-worker-scheduler
