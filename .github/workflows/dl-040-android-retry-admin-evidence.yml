name: DL-040 Android Retry Administration Evidence

on:
  push:
    branches: [codex/dl-retry-046-android-retry-admin-store]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dl-040-android-retry-admin-evidence
  cancel-in-progress: true

jobs:
  qualify-android-retry-administration:
    name: Qualify Android retry administration persistence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATALOOM_ANDROID_BUILD: "true"

    steps:
      - name: Checkout branch head
        uses: actions/checkout@v6
        with:
          ref: codex/dl-retry-046-android-retry-admin-store
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Generate schema and qualify Android persistence
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew \
            :dataloom-queue-room:kspDebugKotlin \
            :dataloom-queue-room:testDebugUnitTest \
            :dataloom-queue-room:assembleDebugAndroidTest \
            --configuration-cache \
            --stacktrace \
            --console=plain \
            --max-workers=1
          schema="dataloom-queue-room/schemas/io.dataloom.queue.room.internal.DataLoomRoomDatabase/5.json"
          test -f "$schema"
          python3 - "$schema" <<'PY'
          import json
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          document = json.loads(path.read_text())
          database = document["database"]
          if database["version"] != 5:
              raise SystemExit(f"Expected Room schema version 5, got {database['version']}")
          identity = database["identityHash"]
          if re.fullmatch(r"[0-9a-f]{32}", identity) is None:
              raise SystemExit(f"Invalid Room identity hash: {identity!r}")
          tables = {entity["tableName"] for entity in database["entities"]}
          expected = {"queue_entries", "circuit_breaker_states", "retry_administration_states"}
          if tables != expected:
              raise SystemExit(f"Unexpected Room tables: {sorted(tables)}")
          print(f"Generated Room v5 schema {identity}")
          PY

      - name: Commit exact schema and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dataloom-queue-room/schemas/io.dataloom.queue.room.internal.DataLoomRoomDatabase/5.json
          git rm .github/workflows/dl-040-android-retry-admin-evidence.yml
          git diff --cached --check
          git commit -m "DL-040: record Android retry administration schema evidence"
          git push origin HEAD:codex/dl-retry-046-android-retry-admin-store
