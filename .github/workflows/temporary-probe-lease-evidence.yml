name: Temporary Probe Lease Evidence

on:
  push:
    branches:
      - codex/dl-retry-017-probe-lease-recovery

permissions:
  contents: write

concurrency:
  group: temporary-probe-lease-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-commit:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DATALOOM_ANDROID_BUILD: "true"

    steps:
      - name: Checkout review branch
        uses: actions/checkout@v6
        with:
          ref: codex/dl-retry-017-probe-lease-recovery
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Generate exact ABI baselines
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :dataloom-api:updateKotlinAbi \
            :dataloom-runtime:updateKotlinAbi \
            :dataloom-apple:updateKotlinAbi \
            --configuration-cache \
            --stacktrace \
            --console=plain

      - name: Validate probe lease recovery across supported consumers
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :build-logic:test \
            :dataloom-api:jvmTest \
            :dataloom-runtime:jvmTest \
            :runtime-external-consumer:compileKotlinJvm \
            :runtime-external-consumer:compileKotlinIosArm64 \
            :runtime-external-consumer:compileKotlinIosSimulatorArm64 \
            :runtime-external-consumer:compileKotlinIosX64 \
            :dataloom-apple:assembleDataLoomReleaseXCFramework \
            --configuration-cache \
            --stacktrace \
            --warning-mode all \
            --console=plain

      - name: Verify generated public evidence
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'probeLeaseUntil' dataloom-api/api/dataloom-api.api
          grep -q 'halfOpenProbeLeaseDuration' dataloom-runtime/api/dataloom-runtime.api
          grep -q 'ProbeLeaseExpired' dataloom-runtime/api/dataloom-runtime.api
          grep -q 'halfOpenProbeLeaseDuration' dataloom-runtime/api/dataloom-runtime.klib.api

      - name: Remove temporary workflow and commit evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temporary-probe-lease-evidence.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No evidence changes to commit."
            exit 0
          fi
          git commit -m "DL-040: qualify abandoned half-open probe recovery"
          git push origin HEAD:codex/dl-retry-017-probe-lease-recovery
