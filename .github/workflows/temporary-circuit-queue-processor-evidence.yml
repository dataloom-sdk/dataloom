name: Temporary Circuit Queue Processor Evidence

on:
  push:
    branches:
      - codex/dl-retry-027-circuit-queue-processor

permissions:
  contents: write

concurrency:
  group: temporary-circuit-queue-processor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-commit:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout review branch
        uses: actions/checkout@v6
        with:
          ref: codex/dl-retry-027-circuit-queue-processor
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Apply API index and integration documentation
        run: python3 .github/scripts/temporary_circuit_queue_processor_docs.py

      - name: Compile and test circuit-aware queue processing
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :dataloom-runtime:jvmTest \
            :dataloom-runtime:iosSimulatorArm64Test \
            :runtime-external-consumer:compileKotlinJvm \
            :runtime-external-consumer:compileKotlinIosArm64 \
            :runtime-external-consumer:compileKotlinIosSimulatorArm64 \
            :runtime-external-consumer:compileKotlinIosX64 \
            --configuration-cache \
            --stacktrace \
            --warning-mode all \
            --console=plain

      - name: Generate exact public ABI baselines
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :dataloom-runtime:updateKotlinAbi \
            :dataloom-apple:updateKotlinAbi \
            --no-configuration-cache \
            --stacktrace \
            --console=plain

      - name: Validate ABI, consumers, and Apple framework
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :dataloom-runtime:checkKotlinAbi \
            :dataloom-runtime:checkPublicAbiBoundaries \
            :dataloom-apple:checkKotlinAbi \
            :runtime-external-consumer:checkRuntimeExternalConsumer \
            :dataloom-apple:assembleDataLoomReleaseXCFramework \
            --no-configuration-cache \
            --stacktrace \
            --warning-mode all \
            --console=plain

      - name: Verify generated circuit processor evidence
        shell: bash
        run: |
          set -euo pipefail
          grep -F "CircuitBreakerDurableQueueExecutionProcessor" \
            dataloom-runtime/api/dataloom-runtime.api
          grep -F "CircuitBreakerQueueProcessingResult" \
            dataloom-runtime/api/dataloom-runtime.klib.api
          grep -F "QueueProcessingCircuitScopes" \
            dataloom-runtime/api/dataloom-runtime.api
          grep -F "Circuit-aware bounded queue processing" \
            docs/api/circuit-queue-processing.md
          grep -F "circuit-aware queue processing" docs/api/README.md
          test -d dataloom-apple/build/XCFrameworks/release/DataLoom.xcframework
          git diff --check

      - name: Commit generated evidence and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/temporary-circuit-queue-processor-evidence.yml \
            .github/scripts/temporary_circuit_queue_processor_docs.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No circuit queue processor evidence to commit."
            exit 1
          fi
          git commit -m "DL-040: qualify circuit-aware queue processing"
          git push origin HEAD:codex/dl-retry-027-circuit-queue-processor
