name: Android Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-validate:
    name: Validate Android modules
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATALOOM_ANDROID_BUILD: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Prepare Android CI logs
        run: mkdir -p android-ci-logs

      - name: Verify Gradle version
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --version 2>&1 | tee android-ci-logs/gradle-version.log

      - name: Reject accidentally committed Gradle plugin metadata
        shell: bash
        run: |
          if [[ -d META-INF/gradle-plugins ]]; then
            echo "Generated META-INF/gradle-plugins must not be committed."
            find META-INF/gradle-plugins -type f -print
            exit 1
          fi

      - name: Verify project structure includes Android modules
        shell: bash
        run: |
          set -o pipefail
          ./gradlew projects \
            --no-configuration-cache \
            --stacktrace \
            --warning-mode all \
            --console=plain 2>&1 | tee android-ci-logs/projects.log

      - name: Assemble dataloom-connectivity-android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :dataloom-connectivity-android:assembleDebug :dataloom-connectivity-android:assembleRelease \
            --stacktrace --console=plain 2>&1 | tee android-ci-logs/connectivity-assemble.log

      - name: Run dataloom-connectivity-android tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :dataloom-connectivity-android:testDebugUnitTest \
            --stacktrace --console=plain 2>&1 | tee android-ci-logs/connectivity-tests.log

      - name: Lint dataloom-connectivity-android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :dataloom-connectivity-android:lintDebug \
            --stacktrace --console=plain 2>&1 | tee android-ci-logs/connectivity-lint.log

      - name: Assemble dataloom-scheduler-workmanager
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :dataloom-scheduler-workmanager:assembleDebug :dataloom-scheduler-workmanager:assembleRelease \
            --stacktrace --console=plain 2>&1 | tee android-ci-logs/scheduler-assemble.log

      - name: Run dataloom-scheduler-workmanager tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :dataloom-scheduler-workmanager:testDebugUnitTest \
            --stacktrace --console=plain 2>&1 | tee android-ci-logs/scheduler-tests.log

      - name: Lint dataloom-scheduler-workmanager
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :dataloom-scheduler-workmanager:lintDebug \
            --stacktrace --console=plain 2>&1 | tee android-ci-logs/scheduler-lint.log

      - name: Assemble dataloom-queue-room
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :dataloom-queue-room:assembleDebug :dataloom-queue-room:assembleRelease \
            --stacktrace --console=plain 2>&1 | tee android-ci-logs/room-assemble.log

      - name: Run dataloom-queue-room tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :dataloom-queue-room:testDebugUnitTest \
            --stacktrace --console=plain 2>&1 | tee android-ci-logs/room-tests.log

      - name: Lint dataloom-queue-room
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :dataloom-queue-room:lintDebug \
            --stacktrace --console=plain 2>&1 | tee android-ci-logs/room-lint.log

      - name: Verify committed Room schema is current
        shell: bash
        run: |
          test -f dataloom-queue-room/schemas/io.dataloom.queue.room.internal.DataLoomRoomDatabase/1.json
          git diff --exit-code -- dataloom-queue-room/schemas

      - name: Build all Android modules
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :dataloom-connectivity-android:build :dataloom-scheduler-workmanager:build :dataloom-queue-room:build \
            --stacktrace --console=plain 2>&1 | tee android-ci-logs/android-build.log

      - name: Verify KMP modules unaffected
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :dataloom-api:allTests :dataloom-core:allTests :dataloom-runtime:allTests :dataloom-testing:allTests \
            --stacktrace --console=plain 2>&1 | tee android-ci-logs/kmp-regression.log

      - name: Upload Android validation logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-validation-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: android-ci-logs
          if-no-files-found: error
          retention-days: 7
