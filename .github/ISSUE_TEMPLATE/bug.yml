name: Bug report
description: Report a reproducible defect in DataLoom repository content.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please provide reproducible, actionable details.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Short description of the bug.
      placeholder: Concise bug summary
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Context needed to reproduce (OS, tool versions, branch/commit).
      placeholder: |
        OS:
        Tooling:
        Branch/commit:
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide deterministic reproduction steps.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant logs or diagnostics
      description: Redact sensitive information before submitting.
      render: text
  - type: checkboxes
    id: no-secrets
    attributes:
      label: Security acknowledgement
      options:
        - label: I confirm this report does not include credentials, tokens, keys, or private data.
          required: true
